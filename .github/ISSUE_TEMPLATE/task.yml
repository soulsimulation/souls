name: Bounded task
description: One lane, one issue. Written by the coordinator before dispatch, with an estimate, the expected files and a stop rule.
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        A task is what one lane does in one session. The coordinator writes every section **before** dispatch. The
        lane does what the acceptance asks and stops; it never edits the Acceptance. The estimate is not a limit:
        the lane reports when stuck or about 2x over and continues unless told to stop. How lanes run it:
        `.claude/agents/lane.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and for whom, in one to three sentences. Name the decision it comes from if there is one.
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done, in one or two sentences.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: At most five observable pass/fail criteria, one box each, with an id. Each names the test, command or number that shows it.
      value: |
        - [ ] **A1**
        - [ ] **A2**
        - [ ] **A3**
    validations: { required: true }
  - type: textarea
    id: not-in
    attributes:
      label: Not in this task
      description: The nearby work a lane might be tempted to do. Name the task that owns each item, or say it is not planned.
    validations: { required: true }
  - type: textarea
    id: touches
    attributes:
      label: Expected files
      description: The files and folders this task is expected to change, for spotting overlaps at dispatch. Not a permission list - the lane edits what the fix needs and lists other files in the pull request; conflicts are resolved at merge.
    validations: { required: true }
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: "The tier (docs/process/PROOF-POLICY.yml) and exactly what proves the task: named tests, runs and their caps."
    validations: { required: true }
  - type: textarea
    id: measure
    attributes:
      label: Measure
      description: How this task shows it helped, and what that measure does not show (the machine, the sample, the load it was taken under). Leave empty when the acceptance is the measure.
  - type: input
    id: ceiling
    attributes:
      label: Estimate
      description: Agent-hours of implementation, not counting CI, review or merge. Not a limit - the lane reports at about 2x.
      placeholder: "2 agent-hours"
    validations: { required: true }
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues or pull requests that must be merged first, or "nothing".
      placeholder: "#123, PR #456 merged"
    validations: { required: true }
  - type: textarea
    id: stop
    attributes:
      label: Stop rule
      description: Keep this text as it is.
      value: |
        Say when you started in your first comment here, and state the time you took in the pull request. Do exactly what the acceptance asks and nothing beside it. Edit the files the fix needs and list those outside the expected files in the pull request. When stuck, or at about 2x the estimate, say so here with the exact next step and continue unless told to stop. Stop when every acceptance box is ticked, marked `unmet:` or marked `deferred:` and the pull request is ready; when the change needs a criterion not listed here; or when the same functional failure survives two fix attempts and an independent diagnosis (environment, load and setup failures don't count). Then push, comment here with what is done and the exact next step, and end the session. A defect you find on the way is fixed in this pull request and listed under "Also fixed" when the fix is small (about 30 minutes or 50 lines), stays in the same area and does not raise the tier; otherwise it gets its own small pull request, with no issue. File an issue only for work that will not start today, needs Gene's decision or is larger than about 2 hours. Only the coordinator changes this issue.
    validations: { required: true }
