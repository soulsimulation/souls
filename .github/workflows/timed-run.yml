# #1943: a timed run (the walk gate or the scripted Soul eval) on a `souls-timed` self-hosted runner, each pinned to
# cores of its own. Manual only. No concurrency group: each runner takes one job, so as many runs go at once as there
# are runners. The control script (.github/scripts/timed-run.mjs) comes from this workflow's commit; the code under
# measurement comes from `ref`, `main` or an `agent/<name>` branch of this repository (anything else is refused before
# checkout). `args` is checked against a per-command allowlist; that is not a security boundary (the ref's own scripts
# run), which rests on the runners' dedicated, unprivileged account. The steps follow capacity-qualify.yml: masked host
# values, per-run tool directories, a per-run pnpm store, an artifact staged through an allowlist and scrubbed, refused
# if it holds a Soul token. A run does not start while the runner's own cores are above the load gate. The last step
# fails on entries of the shared home and /tmp that are new since a snapshot at job start (exclusions are named in
# STRAY_EXCLUDE below, each with its reason). See docs/testing/playtests.md ("Timed runs").
# #1970 adds eval-load (the eval's load mode), bench-client (the capacity bench's client load), meetup (the meetup
# workload) and slopes-profile (the slopes walkers axis with its tick profile): fake minds, scripted Souls. For these the
# world runs on two of the runner's four physical cores and the load generator on the other two; the artifact records it.
# `counted` runs a named counted scenario (a kit under tools/playtest/counted/, from this workflow's commit) for `base`
# and `ref`, `repeats` cells per arm, each cell its own job on its own runner, all at once (one artifact per cell). It
# scores pass/fail per item, so its starting load is recorded and not gated, and `runner=hosted` may run it on the
# GitHub-hosted runners. No media and no web build: the workstation's trees ran without them.
# `clip` records a proof clip of `ref` with the runner's GPU: a clip kit (tools/proof/clips/<kit>/, from this workflow's
# commit) on a fake-mind dev world, recorded by the proof recorder from this workflow's commit with a hardware GL
# renderer (it fails rather than fall back to SwiftShader). The clip and its sidecar are the artifact; the dispatcher
# attaches them to the PR with tools/proof/upload.mjs (this job holds no write token). See docs/testing.md.
# `v2-bench` runs an Engine v2 bench of `ref`: `cargo run -p bench --release --bin <name> -- <args>` from v2/, `repeats`
# times on the runner's own cores, after an untimed release build. The bin must be a [[bin]] of the ref's
# v2/tools/bench/Cargo.toml and the bench's args plain tokens. The toolchain v2/rust-toolchain.toml pins is installed
# with rustup in the per-run directory (RUSTUP_HOME, CARGO_HOME), so nothing lands in the shared home. Each repeat's
# stdout goes to the job summary; the build and run logs are the artifact. No media or web build, and no pnpm install
# unless args name a prep (#3185: `--prep eden-facts` writes Eden's facts and N18's labels into the per-run directory
# before the build, untimed; the bench names them `@facts` and `@labels`). The prep's log is masked and scrubbed alike.
# `check-0132` (F5-run) runs tools/release/check-0132.mjs, 0.132's "Done when" lines 2 to 4, on `ref` with the runner's
# GPU, in a job of its own below: everything it needs is built or fetched into the per-run directory (node 22, pnpm
# install, media, the old page and the character set, Playwright's Chromium, the Rust toolchain with the release builds of
# worldd, gatewayd, directoryd and driver and replica's WASM, the new page, caddy). The check picks the first Chromium
# flag set whose WEBGL_debug_renderer_info names a hardware renderer and does not report line 2 without one. Args:
# --agents (1 to 500), --seconds, --only (a comma list of 2, 3, 4). The artifact is report.json, table.md, check.log and
# the page's clip, each text checked by tools/proof/publication.mjs; the world folders go with the per-run directory.
name: timed-run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: main or an agent/<name> branch of this repository
        required: true
        default: main
      command:
        description: walk, eval-scripted, eval-load, bench-client, meetup, slopes-profile, load, settled, viewers, counted, clip, page, v2-bench or check-0132 (no model in any)
        type: choice
        options: [walk, eval-scripted, eval-load, bench-client, meetup, slopes-profile, load, settled, viewers, counted, clip, page, v2-bench, check-0132]
        default: walk
      base:
        description: 'counted only: the base arm, main or an agent/<name> branch (the candidate arm is ref)'
        default: ''
      runner:
        description: souls-timed; hosted (GitHub-hosted; counted only); souls-wide (12+ cores; split commands with a core plan, settled; docs/testing.md "Wide runner")
        type: choice
        options: [souls-timed, hosted, souls-wide]
        default: souls-timed
      repeats:
        description: Repeats, 1 to 3 (counted - cells per arm)
        default: '1'
      args:
        description: 'Allowlisted: walk --world; eval-scripted --battery <name> --seat scripted --items --warm-sec; eval-load --souls --duration-sec --card-sec; bench-client --arms --profile --raw-from --short; meetup --profile --active-min --short; slopes-profile none; load --world --boots --souls --profile --short; settled --world --souls --settle-min --short; viewers --viewers --window-sec --short; counted --scenario --loop-sec; clip --kit --viewport; page --souls --shape --warm-sec --measure-sec --settle-sec --profile-sec --short; v2-bench --bin <name> [--prep eden-facts] [-- <plain tokens or @facts @labels>]; check-0132 --agents --seconds --only'
        default: ''
      cores:
        description: 'eval-load, bench-client, meetup, slopes-profile, viewers only: a core plan, world=N or world=N,launcher=M (physical cores); the load drivers get the rest. Blank: 2 for the world, the rest for the load'
        default: ''
permissions:
  contents: read
jobs:
  timed:
    if: github.repository == 'soulsimulation/souls' && inputs.command != 'check-0132'
    # counted: one job per cell (base-k, cand-k for k up to repeats), each on its own runner; anything else: one job.
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(inputs.command != 'counted' && '["all"]' || inputs.repeats == '3' && '["base-1","cand-1","base-2","cand-2","base-3","cand-3"]' || inputs.repeats == '2' && '["base-1","cand-1","base-2","cand-2"]' || '["base-1","cand-1"]') }}
    runs-on: ${{ inputs.runner == 'hosted' && 'ubuntu-latest' || inputs.runner == 'souls-wide' && fromJSON('["self-hosted","souls-wide"]') || fromJSON('["self-hosted","souls-timed"]') }}
    timeout-minutes: 120
    env:
      INPUT_REF: ${{ inputs.ref }}
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_REPEATS: ${{ inputs.repeats }}
      INPUT_ARGS: ${{ inputs.args }}
      INPUT_BASE: ${{ inputs.base }}
      INPUT_RUNNER: ${{ inputs.runner }}
      INPUT_CELL: ${{ matrix.cell }}
      INPUT_CORES: ${{ inputs.cores }}
      CTL: ../ctl/.github/scripts/timed-run.mjs
      # The runners share one account home, so A2's check diffs a snapshot of the home and /tmp. Not counted as the job's:
      # - any runner install (a dir holding `.runner`) and the tool cache: the runner service's own _work, _temp, _tool and
      #   _diag; other concurrent jobs keep their per-run directories and checkouts there (excluded in timed-run.mjs);
      # - /tmp/clr-debug-pipe-*, /tmp/dotnet-diagnostic-*: the runner service's .NET diagnostic pipes, one per job worker;
      # - /tmp/cerr-*: the temp dirs of tools/world-launcher/client-errors.test.mjs, from unit-test jobs on this account
      #   (a timed job runs no unit tests);
      # - /tmp/node-compile-cache: Node's compile cache, which pnpm turns on, from other jobs on this account (a timed
      #   job's own processes have TMPDIR in the per-run directory); a v2-bench run, which runs no pnpm, saw it grow;
      # - another account's entries: never read, so never listed.
      STRAY_EXCLUDE: /tmp/clr-debug-pipe-*,/tmp/dotnet-diagnostic-*,/tmp/cerr-*,/tmp/node-compile-cache
    steps:
      # Before anything can print them: the runner's paths, host name and user name never reach the public log.
      - name: Mask host-identifying values
        run: |
          for v in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" "$(hostname)" "$(id -un)"; do
            if [ "${#v}" -ge 4 ]; then echo "::add-mask::$v"; fi
          done
      # Nothing the ref installs outlives this run or reaches another run on this persistent runner.
      - name: Per-run tool directories
        run: |
          d="$RUNNER_TEMP/timed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d/tmp"
          {
            echo "PER_RUN=$d"
            echo "SNAPSHOT=$RUNNER_TEMP/timed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.snapshot.json"
            echo "RECORD=$d/record.json"
            echo "OUT=$d/out"
            echo "ARTIFACT=$d/artifact"
            echo "TMPDIR=$d/tmp"
            echo "npm_config_store_dir=$d/pnpm-store"
            echo "npm_config_cache_dir=$d/pnpm-cache"
            echo "npm_config_state_dir=$d/pnpm-state"
            echo "npm_config_cache=$d/npm-cache"
            echo "npm_config_logs_dir=$d/npm-logs"
            echo "SIM_ASSETS_CACHE=$d/sim-assets"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ctl
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools/playtest/counted
            tools/proof/clips
            .claude/skills/proof
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Snapshot the shared home and /tmp
        working-directory: ctl
        run: node .github/scripts/timed-run.mjs snapshot --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
      - name: Validate inputs
        id: vet
        working-directory: ctl
        run: node .github/scripts/timed-run.mjs inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: src, ref: '${{ steps.vet.outputs.target }}', persist-credentials: false }
      - name: Record the commit
        working-directory: src
        run: echo "REF_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # pnpm's version comes from the ref's package.json `packageManager`; pnpm itself goes in the per-run dir.
      # v2-bench installs only for a prep (#3185: `--prep` in args, checked by Validate inputs); it needs no media.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.INPUT_COMMAND != 'v2-bench' || contains(env.INPUT_ARGS, '--prep')
        with: { package_json_file: src/package.json, dest: '${{ env.PER_RUN }}/setup-pnpm' }
      - name: Install
        if: env.INPUT_COMMAND != 'v2-bench' || contains(env.INPUT_ARGS, '--prep')
        working-directory: src
        run: pnpm install --frozen-lockfile --store-dir "$npm_config_store_dir"
      - name: Pull media
        if: env.INPUT_COMMAND != 'counted' && env.INPUT_COMMAND != 'v2-bench'
        working-directory: src
        timeout-minutes: 15
        run: |
          if [ "$INPUT_COMMAND" = walk ]; then sets=runtime,test; else sets=web,runtime; fi
          timeout 840 pnpm assets:pull --quiet --set "$sets"
      - name: Build the web bundle
        if: env.INPUT_COMMAND != 'walk' && env.INPUT_COMMAND != 'counted' && env.INPUT_COMMAND != 'v2-bench'
        working-directory: src
        run: pnpm --filter @souls/web build
      # the capacity benches' worlds refuse genesis without the viewer bundle; a clip's people are drawn from it
      - name: Build the viewer
        if: env.INPUT_COMMAND == 'bench-client' || env.INPUT_COMMAND == 'meetup' || env.INPUT_COMMAND == 'slopes-profile' || env.INPUT_COMMAND == 'load' || env.INPUT_COMMAND == 'settled' || env.INPUT_COMMAND == 'viewers' || env.INPUT_COMMAND == 'clip' || env.INPUT_COMMAND == 'page'
        working-directory: src
        run: pnpm build:viewer
      # clip: the ref's Playwright version of Chromium, installed in the per-run directory (the shared home stays untouched).
      # The runners are Ubuntu 20.04, which this Playwright no longer names; its Ubuntu 22.04 build runs there.
      - name: Browsers
        if: env.INPUT_COMMAND == 'clip' || env.INPUT_COMMAND == 'page'
        working-directory: src
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PER_RUN/pw-browsers"
          if grep -q 'VERSION_ID="20.04"' /etc/os-release; then export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu22.04-x64; fi
          { echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"; echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=${PLAYWRIGHT_HOST_PLATFORM_OVERRIDE:-}"; } >> "$GITHUB_ENV"
          mars/viewer/node_modules/.bin/playwright install chromium 2>&1 | grep -v "%" | tail -20
      # v2-bench: the channel the ref's v2/rust-toolchain.toml pins, minimal profile, in the per-run directory (no sudo, no
      # shared home); RUSTUP_TOOLCHAIN skips the file's extra components and WASM target, which a native bench never uses.
      - name: Rust toolchain
        if: env.INPUT_COMMAND == 'v2-bench'
        working-directory: src/v2
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          if ! printf '%s' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::no pinned channel in v2/rust-toolchain.toml"; exit 1; fi
          export RUSTUP_HOME="$PER_RUN/rustup" CARGO_HOME="$PER_RUN/cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$PER_RUN/rustup-init.sh"
          # stdout only says where CARGO_HOME is, wrapped past the log mask: dropped
          sh "$PER_RUN/rustup-init.sh" -y --quiet --no-modify-path --profile minimal --default-toolchain "$channel" > /dev/null
          { echo "RUSTUP_HOME=$RUSTUP_HOME"; echo "CARGO_HOME=$CARGO_HOME"; echo "RUSTUP_TOOLCHAIN=$channel"; } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/cargo" --version
      - name: Start load
        working-directory: src
        run: node "$CTL" load --record "$RECORD"
      - name: Run
        working-directory: src
        run: node "$CTL" run --record "$RECORD" --out "$OUT"
      - name: Stage the artifact
        if: always()
        working-directory: src
        run: if [ -f "$RECORD" ]; then node "$CTL" stage --record "$RECORD" --out "$OUT" --dest "$ARTIFACT"; fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timed-run-${{ env.INPUT_COMMAND }}-${{ github.run_id }}${{ matrix.cell != 'all' && format('-{0}', matrix.cell) || '' }}
          path: ${{ env.ARTIFACT }}/
          if-no-files-found: warn
          retention-days: 30
      # Soul tokens, world data, the ref's checkout and the per-run tool directories never outlive the job.
      - name: Clean up
        if: always()
        run: |
          if [ -n "${PER_RUN:-}" ]; then pkill -TERM -f "$PER_RUN/" || true; sleep 5; rm -rf "$PER_RUN"; fi
          rm -rf src
      - name: Nothing written outside the per-run directory
        if: always()
        working-directory: ctl
        run: |
          if [ -z "${SNAPSHOT:-}" ] || [ ! -f "$SNAPSHOT" ]; then echo "::error::no start snapshot"; exit 1; fi
          trap 'rm -f "$SNAPSHOT"' EXIT
          node .github/scripts/timed-run.mjs strays --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
  check-0132:
    if: github.repository == 'soulsimulation/souls' && inputs.command == 'check-0132'
    runs-on: ${{ inputs.runner == 'souls-wide' && fromJSON('["self-hosted","souls-wide"]') || fromJSON('["self-hosted","souls-timed"]') }}
    timeout-minutes: 150
    env:
      INPUT_REF: ${{ inputs.ref }}
      INPUT_ARGS: ${{ inputs.args }}
      INPUT_RUNNER: ${{ inputs.runner }}
      CADDY_VERSION: 2.10.0
      # as timed-run.yml: the runner service's own pipes and other jobs' Node compile cache are not this job's
      STRAY_EXCLUDE: /tmp/clr-debug-pipe-*,/tmp/dotnet-diagnostic-*,/tmp/cerr-*,/tmp/node-compile-cache
    steps:
      - name: Mask host-identifying values
        run: |
          for v in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" "$(hostname)" "$(id -un)"; do
            if [ "${#v}" -ge 4 ]; then echo "::add-mask::$v"; fi
          done
      - name: Inputs
        run: |
          printf '%s' "$INPUT_REF" | grep -Eq '^(main|agent/[A-Za-z0-9._/-]{1,80})$' || { echo "::error::ref must be main or agent/<name>"; exit 1; }
          [ "$INPUT_RUNNER" != hosted ] || { echo "::error::check-0132 needs a runner's GPU: souls-timed or souls-wide"; exit 1; }
          agents=100 seconds=600 only=2,3,4
          set -- $INPUT_ARGS
          while [ $# -gt 0 ]; do
            case "$1" in
              --agents) printf '%s' "${2:-}" | grep -Eq '^([1-9][0-9]{0,2}|500)$' || { echo "::error::--agents: 1 to 500"; exit 1; }; agents=$2;;
              --seconds) printf '%s' "${2:-}" | grep -Eq '^[1-9][0-9]{1,3}$' || { echo "::error::--seconds: 10 to 9999"; exit 1; }; seconds=$2;;
              --only) printf '%s' "${2:-}" | grep -Eq '^[234](,[234]){0,2}$' || { echo "::error::--only: a comma list of 2, 3, 4"; exit 1; }; only=$2;;
              *) echo "::error::check-0132 takes --agents, --seconds, --only"; exit 1;;
            esac
            shift 2
          done
          { echo "INPUT_AGENTS=$agents"; echo "INPUT_SECONDS=$seconds"; echo "INPUT_ONLY=$only"; } >> "$GITHUB_ENV"
      - name: Per-run directories
        run: |
          d="$RUNNER_TEMP/check-0132-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d/tmp" "$d/bin" "$d/artifact"
          {
            echo "PER_RUN=$d"
            echo "SNAPSHOT=$RUNNER_TEMP/check-0132-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.snapshot.json"
            echo "OUT=$d/out"
            echo "ARTIFACT=$d/artifact"
            echo "TMPDIR=$d/tmp"
            echo "npm_config_store_dir=$d/pnpm-store"
            echo "npm_config_cache_dir=$d/pnpm-cache"
            echo "npm_config_state_dir=$d/pnpm-state"
            echo "npm_config_cache=$d/npm-cache"
            echo "npm_config_logs_dir=$d/npm-logs"
            echo "SIM_ASSETS_CACHE=$d/sim-assets"
            echo "RUSTUP_HOME=$d/rustup"
            echo "CARGO_HOME=$d/cargo"
            echo "PLAYWRIGHT_BROWSERS_PATH=$d/pw-browsers"
            echo "XDG_CACHE_HOME=$d/cache"
            echo "XDG_CONFIG_HOME=$d/config"
            echo "XDG_DATA_HOME=$d/data"
          } >> "$GITHUB_ENV"
          { echo "$d/bin"; echo "$d/cargo/bin"; } >> "$GITHUB_PATH"
          # ci.yml's group check keeps its cargo cache in the shared home (~/.cache/souls-group-check) from other runners at
          # the same time: not this job's (its cargo is in the per-run directory)
          echo "STRAY_EXCLUDE=$STRAY_EXCLUDE,$HOME/.cache/souls-group-check" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ctl
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Snapshot the shared home and /tmp
        working-directory: ctl
        run: node .github/scripts/timed-run.mjs snapshot --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: src, ref: '${{ inputs.ref }}', persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: src/package.json, dest: '${{ env.PER_RUN }}/setup-pnpm' }
      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile --store-dir "$npm_config_store_dir"
      - name: Pull media
        working-directory: src
        timeout-minutes: 15
        run: timeout 840 pnpm assets:pull --quiet --set web,runtime
      - name: Build the old page and the people's character set
        working-directory: src
        run: pnpm --filter @souls/web build && pnpm build:viewer
      # The runners are Ubuntu 20.04, which this Playwright no longer names; its Ubuntu 22.04 build runs there (timed-run.yml).
      - name: Browsers
        working-directory: src
        run: |
          if grep -q 'VERSION_ID="20.04"' /etc/os-release; then export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu22.04-x64; echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=$PLAYWRIGHT_HOST_PLATFORM_OVERRIDE" >> "$GITHUB_ENV"; fi
          mars/viewer/node_modules/.bin/playwright install chromium 2>&1 | grep -v "%" | tail -20
      - name: Release builds and replica's WASM
        working-directory: src/v2
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$PER_RUN/rustup-init.sh"
          sh "$PER_RUN/rustup-init.sh" -y --quiet --no-modify-path --profile minimal --default-toolchain "$channel" --target wasm32-unknown-unknown > /dev/null
          cargo build --release --locked -p worldd -p gatewayd -p directoryd -p driver
          bindgen_version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen_version" --locked --root target/tools --quiet
          cargo build -p replica --release --target wasm32-unknown-unknown --locked
          target/tools/bin/wasm-bindgen --target web --out-dir target/wasm-load/pkg target/wasm32-unknown-unknown/release/replica.wasm
      - name: Build the new page
        working-directory: src
        run: npm --prefix v2/web ci --no-audit --no-fund && npm --prefix v2/web run build
      - name: Caddy
        run: |
          case "$(uname -m)" in x86_64) arch=amd64;; aarch64) arch=arm64;; *) echo "::error::no caddy build for $(uname -m)"; exit 1;; esac
          base="https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION"
          tgz="caddy_${CADDY_VERSION}_linux_$arch.tar.gz"
          curl -sSfL "$base/$tgz" -o "$PER_RUN/$tgz"
          curl -sSfL "$base/caddy_${CADDY_VERSION}_checksums.txt" -o "$PER_RUN/caddy-checksums.txt"
          (cd "$PER_RUN" && grep " $tgz\$" caddy-checksums.txt | sha512sum -c -)
          tar -xzf "$PER_RUN/$tgz" -C "$PER_RUN/bin" caddy
          caddy version
      # In its own process group, so the clean-up stops exactly this run's world, servers and browser.
      - name: Run the check
        working-directory: src
        run: |
          set +e
          setsid node tools/release/check-0132.mjs --bin v2/target/release --pkg v2/target/wasm-load/pkg --card v2/web/dist \
            --out "$OUT" --agents "$INPUT_AGENTS" --seconds "$INPUT_SECONDS" --only "$INPUT_ONLY" > "$PER_RUN/check.log" 2>&1 &
          pid=$!; echo "$pid" > "$PER_RUN/check.pgid"
          wait "$pid"; code=$?
          sed "s|$PER_RUN|<run>|g" "$PER_RUN/check.log"
          if [ -f "$OUT/table.md" ]; then { echo "## 0.132 check, lines $INPUT_ONLY"; echo; cat "$OUT/table.md"; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$code"
      - name: Stage the artifact
        if: always()
        working-directory: src
        run: |
          [ -d "$OUT" ] || exit 0
          for f in report.json table.md; do [ -f "$OUT/$f" ] && cp "$OUT/$f" "$ARTIFACT/"; done
          [ -f "$PER_RUN/check.log" ] && sed "s|$PER_RUN|<run>|g" "$PER_RUN/check.log" > "$ARTIFACT/check.log"
          if [ -d "$OUT/clip" ]; then mkdir -p "$ARTIFACT/clip" && cp "$OUT"/clip/*.webm "$ARTIFACT/clip/" 2>/dev/null; fi
          # each text file is checked for device details; one that fails is left out, not published
          for f in "$ARTIFACT"/*.json "$ARTIFACT"/*.md "$ARTIFACT"/*.log; do
            [ -f "$f" ] || continue
            node tools/proof/publication.mjs "$f" > /dev/null 2>&1 || { echo "::warning::$(basename "$f") left out: it names a device detail"; rm -f "$f"; }
          done
          ls -la "$ARTIFACT" "$ARTIFACT/clip" 2>/dev/null | sed "s|$PER_RUN|<run>|g" || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timed-run-check-0132-${{ github.run_id }}
          path: ${{ env.ARTIFACT }}/
          if-no-files-found: warn
          retention-days: 30
      # The worlds, tokens, builds and the checkout never outlive the job (the machine's disk is shared).
      - name: Clean up
        if: always()
        run: |
          if [ -n "${PER_RUN:-}" ]; then
            if [ -f "$PER_RUN/check.pgid" ]; then kill -TERM -- "-$(cat "$PER_RUN/check.pgid")" 2>/dev/null && sleep 5; fi
            rm -rf "$PER_RUN"
          fi
          rm -rf src
      - name: Nothing written outside the per-run directory
        if: always()
        working-directory: ctl
        run: |
          if [ -z "${SNAPSHOT:-}" ] || [ ! -f "$SNAPSHOT" ]; then echo "::error::no start snapshot"; exit 1; fi
          trap 'rm -f "$SNAPSHOT"' EXIT
          node .github/scripts/timed-run.mjs strays --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
