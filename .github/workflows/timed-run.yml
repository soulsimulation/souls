# #1943: a timed run (the walk gate or the scripted Soul eval) on a `souls-timed` self-hosted runner, each pinned to
# cores of its own. Manual only. No concurrency group: each runner takes one job, so as many runs go at once as there
# are runners. The control script (.github/scripts/timed-run.mjs) comes from this workflow's commit; the code under
# measurement comes from `ref`, `main` or an `agent/<name>` branch of this repository (anything else is refused before
# checkout). `args` is checked against a per-command allowlist; that is not a security boundary (the ref's own scripts
# run), which rests on the runners' dedicated, unprivileged account. The steps follow capacity-qualify.yml: masked host
# values, per-run tool directories, a per-run pnpm store, an artifact staged through an allowlist and scrubbed, refused
# if it holds a Soul token. A run does not start while the runner's own cores are above the load gate. The last step
# fails on entries of the shared home and /tmp that are new since a snapshot at job start (exclusions are named in
# STRAY_EXCLUDE below, each with its reason). See docs/testing/playtests.md ("Timed runs").
# #1970 adds eval-load (the eval's load mode), bench-client (the capacity bench's client load), meetup (the meetup
# workload) and slopes-profile (the slopes walkers axis with its tick profile): fake minds, scripted Souls. For these the
# world runs on two of the runner's four physical cores and the load generator on the other two; the artifact records it.
# #2147: `runner` picks the runner set. eval-scripted scores pass/fail per item, so it goes to `souls-heavy` by default
# and its starting load is recorded, not gated; every timing command stays on `souls-timed`, gated (the route job refuses
# anything else). `arm=base` measures the main commit the ref is based on and reuses a cached result for that commit,
# battery and seat; the artifact's timed-run.json says `base.cache` hit or miss.
name: timed-run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: main or an agent/<name> branch of this repository
        required: true
        default: main
      command:
        description: walk, eval-scripted, eval-load, bench-client, meetup or slopes-profile (no model in any)
        type: choice
        options: [walk, eval-scripted, eval-load, bench-client, meetup, slopes-profile]
        default: walk
      runner:
        description: auto (eval-scripted on souls-heavy, every timing command on souls-timed), souls-heavy or souls-timed
        type: choice
        options: [auto, souls-heavy, souls-timed]
        default: auto
      arm:
        description: 'eval-scripted only: ref (the ref itself) or base (the main commit the ref is based on, cached)'
        type: choice
        options: [ref, base]
        default: ref
      repeats:
        description: Repeats, 1 to 3
        default: '1'
      args:
        description: 'Allowlisted: walk --world; eval-scripted --items --warm-sec; eval-load --souls --duration-sec --card-sec; bench-client --arms --profile --raw-from --short; meetup --profile --active-min --short; slopes-profile none'
        default: ''
permissions:
  contents: read
env:
  INPUT_REF: ${{ inputs.ref }}
  INPUT_COMMAND: ${{ inputs.command }}
  INPUT_RUNNER: ${{ inputs.runner }}
  INPUT_ARM: ${{ inputs.arm }}
  INPUT_REPEATS: ${{ inputs.repeats }}
  INPUT_ARGS: ${{ inputs.args }}
jobs:
  # The inputs are checked and the runner set chosen before any self-hosted runner is taken.
  route:
    if: github.repository == 'soulsimulation/souls'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.route.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: .github/scripts, persist-credentials: false }
      - name: Route
        id: route
        run: node .github/scripts/timed-run.mjs route
  timed:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
    timeout-minutes: 120
    env:
      CTL: ../ctl/.github/scripts/timed-run.mjs
      # The runners share one account home, so A2's check diffs a snapshot of the home and /tmp. Not counted as the job's:
      # - any runner install (a dir holding `.runner`) and the tool cache: the runner service's own _work, _temp, _tool and
      #   _diag; other concurrent jobs keep their per-run directories and checkouts there (excluded in timed-run.mjs);
      # - /tmp/clr-debug-pipe-*, /tmp/dotnet-diagnostic-*: the runner service's .NET diagnostic pipes, one per job worker;
      # - /tmp/cerr-*: the temp dirs of tools/world-launcher/client-errors.test.mjs, from unit-test jobs on this account
      #   (a timed job runs no unit tests);
      # - another account's entries: never read, so never listed.
      STRAY_EXCLUDE: /tmp/clr-debug-pipe-*,/tmp/dotnet-diagnostic-*,/tmp/cerr-*
    steps:
      # Before anything can print them: the runner's paths, host name and user name never reach the public log.
      - name: Mask host-identifying values
        run: |
          for v in "$HOME" "$GITHUB_WORKSPACE" "$RUNNER_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE" "$(hostname)" "$(id -un)"; do
            if [ "${#v}" -ge 4 ]; then echo "::add-mask::$v"; fi
          done
      # Nothing the ref installs outlives this run or reaches another run on this persistent runner.
      - name: Per-run tool directories
        run: |
          d="$RUNNER_TEMP/timed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$d/tmp"
          {
            echo "PER_RUN=$d"
            echo "SNAPSHOT=$RUNNER_TEMP/timed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.snapshot.json"
            echo "RECORD=$d/record.json"
            echo "OUT=$d/out"
            echo "ARTIFACT=$d/artifact"
            echo "TMPDIR=$d/tmp"
            echo "npm_config_store_dir=$d/pnpm-store"
            echo "npm_config_cache_dir=$d/pnpm-cache"
            echo "npm_config_state_dir=$d/pnpm-state"
            echo "npm_config_cache=$d/npm-cache"
            echo "npm_config_logs_dir=$d/npm-logs"
            echo "SIM_ASSETS_CACHE=$d/sim-assets"
          } >> "$GITHUB_ENV"
          rm -rf base-cache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: ctl, sparse-checkout: .github/scripts, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Snapshot the shared home and /tmp
        working-directory: ctl
        run: node .github/scripts/timed-run.mjs snapshot --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
      - name: Validate inputs
        id: vet
        working-directory: ctl
        run: node .github/scripts/timed-run.mjs inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: src, ref: '${{ steps.vet.outputs.target }}', persist-credentials: false, fetch-depth: "${{ inputs.arm == 'base' && '0' || '1' }}" }
      # arm=base: the checkout moves to the ref's merge base with main, and the cache key names that commit.
      - name: Record the commit
        id: commit
        working-directory: src
        run: node "$CTL" commit
      - name: Restore a cached base arm
        id: cache
        if: inputs.arm == 'base'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: base-cache, key: '${{ steps.commit.outputs.key }}' }
      # pnpm's version comes from the ref's package.json `packageManager`; pnpm itself goes in the per-run dir.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: src/package.json, dest: '${{ env.PER_RUN }}/setup-pnpm' }
      - name: Install
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src
        run: pnpm install --frozen-lockfile --store-dir "$npm_config_store_dir"
      - name: Pull media
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: src
        timeout-minutes: 15
        run: |
          if [ "$INPUT_COMMAND" = walk ]; then sets=runtime,test; else sets=web,runtime; fi
          timeout 840 pnpm assets:pull --quiet --set "$sets"
      - name: Build the web bundle
        if: env.INPUT_COMMAND != 'walk' && steps.cache.outputs.cache-hit != 'true'
        working-directory: src
        run: pnpm --filter @souls/web build
      # the capacity benches' worlds refuse genesis without the viewer bundle
      - name: Build the viewer
        if: env.INPUT_COMMAND == 'bench-client' || env.INPUT_COMMAND == 'meetup' || env.INPUT_COMMAND == 'slopes-profile'
        working-directory: src
        run: pnpm build:viewer
      - name: Start load
        working-directory: src
        run: node "$CTL" load --record "$RECORD"
      - name: Run
        id: run
        working-directory: src
        env:
          BASE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: node "$CTL" run --record "$RECORD" --out "$OUT" --cached ../base-cache
      - name: Stage the artifact
        if: always()
        working-directory: src
        run: if [ -f "$RECORD" ]; then node "$CTL" stage --record "$RECORD" --out "$OUT" --dest "$ARTIFACT"; fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timed-run-${{ env.INPUT_COMMAND }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT }}/
          if-no-files-found: warn
          retention-days: 30
      # A2: a base arm measured here is cached from its staged (scrubbed) files, for the next candidate on the same commit.
      - name: Keep the base arm
        if: inputs.arm == 'base' && steps.cache.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
        run: mkdir base-cache && cp -R "$ARTIFACT"/. base-cache/
      - name: Cache the base arm
        if: inputs.arm == 'base' && steps.cache.outputs.cache-hit != 'true' && steps.run.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: base-cache, key: '${{ steps.commit.outputs.key }}' }
      # Soul tokens, world data, the ref's checkout and the per-run tool directories never outlive the job.
      - name: Clean up
        if: always()
        run: |
          if [ -n "${PER_RUN:-}" ]; then pkill -TERM -f "$PER_RUN/" || true; sleep 5; rm -rf "$PER_RUN"; fi
          rm -rf src base-cache
      - name: Nothing written outside the per-run directory
        if: always()
        working-directory: ctl
        run: |
          if [ -z "${SNAPSHOT:-}" ] || [ ! -f "$SNAPSHOT" ]; then echo "::error::no start snapshot"; exit 1; fi
          trap 'rm -f "$SNAPSHOT"' EXIT
          node .github/scripts/timed-run.mjs strays --snapshot "$SNAPSHOT" --exclude "$STRAY_EXCLUDE"
