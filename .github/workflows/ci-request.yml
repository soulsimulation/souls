# The CI window's request path (docs/testing.md#ci-window). Adding ci:run or merge:ready to a ready, same-repo PR starts
# its path-scoped CI: a workflow_dispatch of ci.yml on the PR branch with `pr`, which the window always lets through.
# Nothing is dispatched when the head's newest ci run already passed. The dispatched run queues behind a ci run in
# progress for the same PR (one concurrency group), and does no heavy work if that run passes at the same head.
# pull_request_target runs main's copy of this file and checks out main only, never the PR's code.
# A dispatch runs the branch's own ci.yml. A branch cut before the window (#914) has no `pr` input there, and GitHub
# refuses the dispatch (HTTP 422), so such a PR gets one comment asking to merge main forward instead (the PR's ci.yml
# is read as data through the contents API, never run).
name: ci-request
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
jobs:
  request:
    if: >-
      (github.event.label.name == 'ci:run' || github.event.label.name == 'merge:ready') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Captured first so `bash -e` fails the step when a helper fails (inside `[ "$(...)" ]` it would not).
          green="$(node .github/scripts/ci-scope.mjs green --repo "$REPO" --sha "$HEAD_SHA")"
          if [ "$green" = true ]; then
            echo "ci already passed at $HEAD_SHA; nothing to request"
            exit 0
          fi
          dispatchable="$(node .github/scripts/ci-scope.mjs dispatchable --repo "$REPO" --sha "$HEAD_SHA")"
          if [ "$dispatchable" != true ]; then
            echo "::notice title=Merge main forward::ci.yml at $HEAD_SHA has no pr input (it predates #914); nothing dispatched"
            node .github/scripts/ci-scope.mjs merge-forward --repo "$REPO" --pr "$PR"
            exit 0
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF" -f pr="$PR"
          echo "requested ci for #$PR on $HEAD_REF ($HEAD_SHA)"
