# Keeps secrets, databases, media and private values out of a public repository.
#   gitleaks    .gitleaks.toml over the new commits (the whole history on the weekly run and on a manual run)
#   path-guard  no *.sqlite*/*.db, .eden-agent.json/.eden-god.json, .env, or binary files outside
#               .github/guards/media-allowlist.txt anywhere in the tree
#   scrub-guard lines added by the change: no home paths, private workspace paths, public IPs, private host names,
#               ssh targets or personal emails (.github/scripts/guards.mjs)
#               and the released core body revisions stay append-only (guards.mjs ledger, #845)
name: security
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # The same 8.30.1 from sources other than a GitHub release download (#1373), each verified, used only if it fails.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      GITLEAKS_MODULE_SUM: h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned and verified; fails closed)
        run: bash .github/scripts/install-gitleaks.sh "$RUNNER_TEMP"
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "Scanning the whole history"; opts="--all"
          else
            echo "Scanning $BASE..$HEAD_SHA"; opts="$BASE..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="$opts" .

  path-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node --test .github/scripts/guards.test.mjs
      - run: node .github/scripts/guards.mjs paths

  scrub-guard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node .github/scripts/guards.mjs scrub --base "$BASE" --head "$HEAD_SHA"
      - run: node .github/scripts/guards.mjs ledger --base "$BASE" --head "$HEAD_SHA"
