# Application checks on isolated runners, scoped to what a change touches. The daily scheduled run on main and manual
# runs are full scope (every qualify job and the local smoke): the merge train lands T0-T2 PRs without re-testing them
# only while main's latest full-scope run is green (.github/scripts/merge-train.mjs, mainCiState).
# The job matrix is the release gate's CPU contract split for GitHub runners; `scope` picks jobs with the same path
# map as `tools/test-harness/release-gate.mjs --scope auto` (.github/scripts/ci-scope.mjs). Branch protection requires
# the single `ci-ok` check. The full Modal gate still qualifies releases (release.yml); CI is the per-PR check.
# CI window (docs/testing.md#ci-window): every push to a ready (non-draft) pull request runs its jobs once, with no label;
# a draft runs scope and repo, and ci-ok fails as "full CI deferred" when heavy jobs were selected, until it is marked
# ready. Labels start no run. In the merge queue no test runs again: a PR enters only with its required checks green at
# its head, so a merge_group run skips scope, repo, qualify and smoke, and ci-ok waits only for group-check, which
# compiles the combined code (B1-8: cargo check of v2, tsc of apps/web, by what changed); the push to main that
# lands it runs its paths' light set as the net. `gh workflow run ci.yml --ref <branch> -f pr=<n>` still runs a PR's
# path-scoped CI by hand, but its checks don't count for the queue.
# Pull request and push runs never run the qualify legs ci-scope.mjs marks `heavy: true` (lightOnly): the
# full battery runs once a day on main (schedule, 06:23 UTC), on a manual run, and before a release in the remote gate,
# not per change (Gene, 18 Nov: startup mode). A push to main runs the light set its paths pick. Push
# runs share one concurrency group, `ci-main`, where a newer push cancels an older one still running; the daily run has
# its own group, `ci-daily`, and is never cancelled (docs/testing.md#ci-window).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Run this PR's path-scoped CI on its branch (the CI window); empty runs full scope
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || github.event_name == 'schedule' && 'ci-daily' || format('ci-{0}', github.event.pull_request.number || inputs.pr || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
# tools/assets pull keeps its content-addressed download cache in its default ~/.cache/sim-assets: on a self-hosted
# runner that persists on the host's disk across jobs; on a GitHub-hosted one, the media cache steps below carry it.
jobs:
  # scope, repo and ci-ok (and the required security, fragment and merge_group proof jobs) run on
  # CI_LIGHT_RUNNER when set (a label, or a JSON label list), else GitHub-hosted. Unset it to go back to hosted runners.
  scope:
    # A merge group runs nothing: ci-ok reports the PR's own result (below).
    if: github.event_name != 'merge_group'
    runs-on: ${{ vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      any: ${{ steps.scope.outputs.any }}
      scope: ${{ steps.scope.outputs.scope }}
      smoke: ${{ steps.scope.outputs.smoke }}
      deferred: ${{ steps.scope.outputs.deferred }}
      green: ${{ steps.scope.outputs.green }}
      window: ${{ steps.scope.outputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # A requested run queues behind any run already in its concurrency group; if that one passed at this head, the
      # heavy work is done (never re-run a passing check on the same tree). A requested run reads only requested runs:
      # a pull_request run's pass covers no heavy leg (ci-scope.mjs lightOnly).
      - id: green
        name: Already green at this head
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENTS: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || '' }}
        run: echo "green=$(node .github/scripts/ci-scope.mjs green --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --self "$GITHUB_RUN_ID" --events "$EVENTS")" >> "$GITHUB_OUTPUT"
      - id: scope
        name: Pick jobs from changed paths
        env:
          BASE: ${{ inputs.pr && format('origin/{0}', github.event.repository.default_branch) || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ inputs.pr && 'request' || github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          GREEN: ${{ steps.green.outputs.green || false }}
        # The daily run and a manual run check everything (FULL_EVENTS); the merge train reads those runs.
        run: node .github/scripts/ci-scope.mjs --base "$BASE" --head "$HEAD_SHA" --event "$EVENT" --draft "$DRAFT" --green-at-head "$GREEN"

  # Fast, dependency-free checks of the repo's own tooling. Skipped when scope found the head already green (a requested
  # run at a head whose newest requested run passed), and in a merge group, where scope does not run.
  repo:
    needs: scope
    if: needs.scope.outputs.green != 'true'
    runs-on: ${{ vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # #1462: a removed or renamed gate test is declared in tools/test-harness/renames.json in the same change, and a
      # newly skipped one in quarantine.json, so a release never blocks on an intended rewrite (docs/testing/remote-gate.md#renames)
      - name: Gate renames and skips declared
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/gate-renames.mjs --base "$BASE" --head HEAD
      - name: Media manifest, CI scope, proof, merge train, restack, hooks, changelog and guard tests
        run: >-
          node --test --test-concurrency=1
          tools/assets/manifest.test.mjs
          tools/assets/mars-web.test.mjs
          .github/scripts/ci-scope.test.mjs
          .github/scripts/ci-main.test.mjs
          .github/scripts/codex-files.test.mjs
          .github/scripts/gate-renames.test.mjs
          .github/scripts/server-test-files.test.mjs
          .github/scripts/server-test-durations.test.mjs
          .github/scripts/guards.test.mjs
          tools/test-harness/browser-channel.test.mjs
          .github/scripts/merge-train.test.mjs
          .github/scripts/restack.test.mjs
          .github/scripts/install-hooks.test.mjs
          tools/proof/tier.test.mjs
          tools/proof/gate.test.mjs
          tools/proof/acceptance.test.mjs
          tools/proof/upload.test.mjs
          tools/coordinator/status.test.mjs
          tools/changelog/compile.test.mjs
          e2e/local-smoke.test.mjs

  # Codex's files (Gene, 26 Nov; #5068): a lane's PR (a commit with a `Co-Authored-By: Claude` trailer) fails when it
  # changes a file in tools/ci/codex-files.txt (a `warn` entry only reports); Codex's PRs pass. It reads the PR's
  # changed files, commits and labels from the API
  # and checks out just the script and the list. Labels start no run: after the coordinator adds `codex:files-ok`,
  # re-run the failed jobs; the labels are read when the job runs. .github/scripts/codex-files.mjs
  codex-files:
    if: github.event_name == 'pull_request' || inputs.pr != ''
    runs-on: ${{ vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/codex-files.mjs
            tools/ci/codex-files.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: No Codex files changed outside Codex's PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node .github/scripts/codex-files.mjs --repo "$GITHUB_REPOSITORY" --pr "$PR"

  qualify:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.any == 'true'
    # A job the matrix marks heavy (ci-scope.mjs: the server shards and the long legs) runs on the repository variable
    # CI_HEAVY_RUNNER when it is set; a `light` one on CI_LIGHT_RUNNER when that is set; every other job, and every job
    # while they are unset, runs on ubuntu-latest, so a run
    # uses both pools at once. The value is one runner label (`souls-ci`) or a JSON array (`["self-hosted","souls-ci"]`).
    # `native` is never heavy: its camera perf budget is wall time, and a shared host under load misses it (#1162).
    runs-on: ${{ matrix.heavy && vars.CI_HEAVY_RUNNER && (startsWith(vars.CI_HEAVY_RUNNER, '[') && fromJSON(vars.CI_HEAVY_RUNNER) || vars.CI_HEAVY_RUNNER) || matrix.light && vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    # The recursive server inventory (about an hour of tests in all) runs in duration-balanced shards of ~10 minutes each.
    # a launcher leg passes in about 9 min on hosted runners; 40 fails a hung test file in time to keep the merge queue moving.
    # Every other kind: about 2x the p95 of its green runs, and never under 1.5x the slowest (the 100 green runs before
    # 21 Nov, job wall time in minutes, p95/max): native 15.0/17.8 -> 30; v2 10.0/29.6 (a cold cargo build) -> 45;
    # packages 9.2/9.3 and web 8.0/8.1 -> 20; types-web, client-cli, latency
    # and soul-tools all under 2.3 -> 15, room for a cold install. Re-measure before tightening.
    timeout-minutes: ${{ matrix.kind == 'server' && 45 || matrix.kind == 'launcher' && 40 || matrix.kind == 'v2' && 45 || matrix.kind == 'native' && 30 || matrix.kind == 'packages' && 20 || matrix.kind == 'web' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # pnpm's version comes from package.json `packageManager` (pnpm@10.27.0). The `v2` job (Rust only) skips the install.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.kind != 'v2'
        # Instances on one host share a user and home, so the default dest would collide between concurrent jobs (#1162).
        with: { dest: '${{ runner.temp }}/setup-pnpm' }
      # The v2 job too: its web steps run TypeScript, which needs Node 22.18 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # The pnpm store cache, GitHub-hosted only, saved only on main. The store sits under PNPM_HOME (the dest above,
      # in runner.temp), and actions/cache versions an entry by its path: setup-node's `cache: pnpm` made one copy per
      # self-hosted instance and one per PR ref, about 9.5 GB of the repo's 10 GB. A self-hosted job installs from the
      # registry; a PR or merge-queue ref restores main's entry.
      - name: Locate the pnpm store
        id: pnpm-store
        if: matrix.kind != 'v2' && runner.environment == 'github-hosted'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        if: steps.pnpm-store.outputs.path
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.kind != 'v2'
        run: pnpm install --frozen-lockfile
      - name: Save pnpm store
        if: steps.pnpm-store.outputs.path && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # PRs do not carry a rebuilt eden.mjs (docs/testing.md#the-soul-client-file): every job tests the client built from
      # this head's modules (soul/*.mjs, packages/form-rules/src/rules.ts), and a failure to inline fails the job
      - name: Build eden.mjs from its modules
        if: matrix.kind != 'v2'
        run: node tools/world-launcher/soul/inline.mjs
      # Engine v2 (K15, #2637): the toolchain v2/rust-toolchain.toml pins, and a cargo cache keyed on it and the lockfile.
      - name: Install the pinned Rust toolchain
        if: matrix.kind == 'v2'
        working-directory: v2
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          cargo --version
      # Every v2 leg restores the one cache (about 7.6 GB of the repo's 10 GB, so no cache per leg); only the rust leg,
      # which builds most of the workspace's dependencies, saves it, on a miss, after its checks (below).
      - name: Restore cargo cache
        id: cargo-cache
        if: matrix.kind == 'v2'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/target
          key: v2-cargo-${{ runner.os }}-${{ hashFiles('v2/rust-toolchain.toml', 'v2/Cargo.lock') }}
          restore-keys: v2-cargo-${{ runner.os }}-
      # GitHub-hosted only (a self-hosted runner keeps ~/.cache/sim-assets on disk). The path must have no `.` or `..`
      # segment, or actions/cache refuses to save it. Saved below, right after a pull on main, whatever the tests do; a
      # PR or merge-queue ref restores main's cache (its own entries would be scoped to that ref and only evict main's).
      - name: Restore media cache
        id: media-cache
        if: matrix.assets && runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sim-assets
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
          restore-keys: sim-assets-
      # Bounded: every request that stalls for 20 s is aborted and retried (5 tries); each path that still fails is
      # printed with its reason (HTTP status, timeout, network error, hash mismatch) as it happens.
      - name: Pull media
        if: matrix.assets
        timeout-minutes: 15
        run: |
          if ! timeout 840 pnpm assets:pull --quiet; then
            echo "::error::Media pull failed or timed out. Each failed path is listed above with its reason: HTTP 404/403 means it is not on the CDN (publish it first: tools/cdn/publish.mjs, see tools/assets/README.md); timeouts, 5xx and network errors are the CDN or the runner's network, so re-run."
            exit 1
          fi
      - name: Save media cache
        if: matrix.assets && runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sim-assets
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
      - name: Run assigned checks
        env:
          CHECK_KIND: ${{ matrix.kind }}
          V2_LEG: ${{ matrix.leg }}
          SERVER_SHARD: ${{ matrix.shard }}
          TEST_LEG: ${{ matrix.shard }}
          GOD_SKILL: ${{ matrix.godSkill || false }}
        shell: bash
        run: |
          case "$CHECK_KIND" in
            types-web)
              pnpm typecheck
              pnpm --filter @souls/web build
              # V3-bundle's comparison, on the build above, so growth is seen on the PR that causes it (#1117)
              node tools/test-harness/bundle-budget/budget.mjs --check
              # The Mars viewer's static site holds the people's character set (/modular); without it no world
              # draws people (issue #395). Build it as the first run does, then fail if the set is missing.
              pnpm build:viewer
              node tools/assets/mars-web.mjs --check
              ;;
            packages)
              pnpm -r --filter '!mars-campus-viewer' --filter '!@souls/server' test
              ;;
            native)
              pnpm test:mars
              ;;
            web)
              # V4-web: every apps/web unit test, TSX included. The root build first, as V2-build-root does before V4 in
              # the gate: docs-site.test.ts checks its files and skips without it (#1463: a skip is not proof)
              pnpm --filter @souls/web build
              bash tools/test-harness/web-suite.sh
              ;;
            launcher)
              # V3-launcher-unit; each test file takes a free block of ports (tools/lib/test-port.ts).
              # restic for backup-restic.test.mjs, the same pinned release binary the gate's image installs
              # (modal_suite.py); without it that test skips (#1463: a skip is not proof). x86_64 only; elsewhere it skips
              # and the release gate runs the step on Modal.
              if [ "$(uname -m)" = x86_64 ] && ! command -v restic >/dev/null; then
                mkdir -p "$RUNNER_TEMP/bin"
                # #1507: the release CDN 504s at times; retry with backoff, and still fail loudly once retries run out.
                # #2144: the self-hosted runners' curl predates --retry-all-errors (7.71); there --retry covers 5xx and timeouts.
                retry_all=--retry-connrefused
                # grep reads all input (no -q): under pipefail an early exit would SIGPIPE curl and hide the option.
                curl --help all 2>/dev/null | grep -- --retry-all-errors >/dev/null && retry_all=--retry-all-errors
                curl -fsSL --connect-timeout 20 --retry 5 "$retry_all" --retry-delay 5 -o "$RUNNER_TEMP/restic.bz2" \
                  https://github.com/restic/restic/releases/download/v0.16.4/restic_0.16.4_linux_amd64.bz2 \
                  || { echo "::error::restic download failed after 5 retries (#1507); backup-restic.test.mjs would only skip, so this job fails"; exit 1; }
                echo "3d4d43c169a9e28ea76303b1e8b810f0dcede7478555fdaa8959971ad499e324  $RUNNER_TEMP/restic.bz2" | sha256sum -c -
                bunzip2 -c "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/bin/restic" && chmod 755 "$RUNNER_TEMP/bin/restic"
                export PATH="$RUNNER_TEMP/bin:$PATH"; restic version
              fi
              # this leg's share of tools/world-launcher/*.test.mjs and tools/world-launcher/soul/*.test.mjs (test-legs.mjs)
              list=$(node .github/scripts/test-legs.mjs launcher "$TEST_LEG"); mapfile -t files <<< "$list"
              echo "launcher leg $TEST_LEG: ${#files[@]} files"
              node --test --test-concurrency=1 "${files[@]}"
              ;;
            client-cli)
              # V3-client-cli
              pnpm test:client
              ;;
            latency)
              pnpm --filter @souls/server exec node --test --test-concurrency=1 src/owner-response-milestones.test.ts
              ;;
            soul-tools)
              # #1111: not a gate step; picked by ci-scope.mjs from its own paths
              node --test --test-concurrency=4 tools/soul-runtime/*.test.mjs tools/soul-trace/*.test.mjs
              # the launcher test that reads content/kinds
              node --test --test-concurrency=4 tools/world-launcher/soul/card-search.test.mjs
              ;;
            kinds)
              # The kinds' case files: the entry format and its gates (check, look, prove), and form-rules' own tests over
              # packages/form-rules/cases. Picked only by content/kinds, packages/form-rules and tools/entry (ci-scope.mjs).
              node --test --test-concurrency=4 tools/entry/*.test.mjs
              node --test --test-concurrency=4 packages/form-rules/src/*.test.ts
              ;;
            v2)
              # Engine v2 (K15, #2637): not a gate step; picked by ci-scope.mjs from its own paths
              bash v2/tools/ci.sh "$V2_LEG"
              ;;
            server)
              # The server shard, then (on the shard with `godSkill`, ci-scope.mjs) the god-skill unit tests, replay
              # corpus included; both always run, either failing fails the job.
              server=0
              node --input-type=module <<'NODE' || server=$?
          import { spawnSync } from 'node:child_process';
          import { serverTestFiles, serverShardPlan, SERVER_TEST_CONCURRENCY } from './.github/scripts/server-test-files.mjs';
          const all = serverTestFiles(), shard = Number(process.env.SERVER_SHARD);
          const { parallel, serial } = serverShardPlan(all, shard);
          console.log(JSON.stringify({ shard, totalServerFiles: all.length, files: [...parallel, ...serial], parallel: parallel.length, serial: serial.length, concurrency: SERVER_TEST_CONCURRENCY }));
          // ephemeral-port files in parallel, then the fixed-port files one at a time; both always run, either failing fails the job
          const run = (files, n) => { if (!files.length) return 0; const r = spawnSync('pnpm', ['--filter', '@souls/server', 'exec', process.execPath, '--test', `--test-concurrency=${n}`, ...files], { stdio: 'inherit' }); if (r.error) throw r.error; return r.status ?? 1; };
          const a = run(parallel, SERVER_TEST_CONCURRENCY), b = run(serial, 1);
          process.exit(a || b);
          NODE
              god=0
              if [ "$GOD_SKILL" = true ]; then node --test --test-concurrency=1 tools/god-skill/*.test.mjs tools/god-skill/lib/*.test.mjs tools/god-skill/scripts/*.test.mjs tools/god-skill/e2e/*.test.mjs || god=$?; fi
              exit $(( server || god ))
              ;;
            *) echo "unknown check kind: $CHECK_KIND"; exit 1 ;;
          esac
      - name: Save cargo cache
        if: matrix.kind == 'v2' && matrix.leg == 'rust' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/target
          key: v2-cargo-${{ runner.os }}-${{ hashFiles('v2/rust-toolchain.toml', 'v2/Cargo.lock') }}
      - name: Retain synthetic join failure diagnostics
        if: failure() && matrix.kind == 'v2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r21-join-sync-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: .local/r21-join-sync-failure-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      # Body-authoring renderer checks (#843): they import the Mars renderer, whose parameter properties need
      # --experimental-transform-types (Node 22 has it). One server leg runs them; it has the media they read.
      - name: Body-authoring renderer tests
        if: matrix.kind == 'server' && matrix.shard == 0
        shell: bash
        run: |
          shopt -s nullglob
          files=(tools/body-authoring/*/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No body-authoring tests in this tree."; exit 0; fi
          node --experimental-transform-types --test --test-concurrency=1 "${files[@]}"

  # The local smoke (e2e/local-smoke.mjs, docs/testing/e2e.md#local-smoke): an isolated fake-mind instance, the world
  # list and one world in headless Chromium (SwiftShader, no GPU), a person drawn, no console errors or failed requests.
  smoke:
    needs: scope
    if: needs.scope.outputs.smoke == 'true'
    # Always GitHub-hosted, whatever CI_HEAVY_RUNNER says: `playwright install --with-deps` installs Chromium's system
    # libraries through apt, which a self-hosted runner without root, or with an OS Playwright does not support, cannot do.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.e2e/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same dest, store path and key as the qualify legs, so this job reads main's pnpm store entry (restore only).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { dest: '${{ runner.temp }}/setup-pnpm' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Restore only: this job pulls only web,runtime, and a save under the shared key would leave out the test set.
      - name: Restore media cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sim-assets
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
          restore-keys: sim-assets-
      - name: Pull media (web, runtime)
        timeout-minutes: 15
        run: timeout 840 pnpm assets:pull --quiet --set web,runtime
      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # If the runner's apt mirror (azure.archive.ubuntu.com) is unreachable, point apt at archive.ubuntu.com and retry
      # once: same packages, same browser, only the download host changes.
      - name: Install Chromium and its system libraries
        run: |
          pw_install() { pnpm --filter mars-campus-viewer exec playwright install --with-deps --only-shell chromium; }
          pw_install && exit 0
          echo "::warning::apt install failed; retrying against archive.ubuntu.com"
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          pw_install
      - name: Local smoke
        timeout-minutes: 10
        run: node e2e/local-smoke.mjs --build --port 9950 --out .local/e2e/ci
      - name: Upload the summary and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-smoke
          path: |
            .local/e2e/ci/summary.json
            .local/e2e/ci/shots/
            .local/e2e/ci/launcher.log
          if-no-files-found: warn
          retention-days: 14

  # B1-8: in a merge group the combined code must still compile. Two PRs green at their own heads can combine into a red
  # main (#4220 + #4291: a struct field one added and the other did not set). Compile only, no tests: `cargo check` of
  # the v2 workspace and `tsc -p apps/web`, each only when the group changed what it builds from (ci-scope.mjs
  # groupChecks), on the self-hosted pool (GROUP_CHECK_RUNNER, else souls-heavy), with the toolchain and cargo target kept per
  # runner on its host so a check is incremental.
  # ci-ok waits for it in a merge group; it never runs on a pull request or a push.
  group-check:
    if: github.event_name == 'merge_group'
    runs-on: ${{ fromJSON(vars.GROUP_CHECK_RUNNER || '["self-hosted","souls-heavy"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - id: what
        name: What the group changed
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node .github/scripts/ci-scope.mjs group --base "$BASE" --head "$HEAD_SHA"
      # As gateway-linux.yml's toolchain, but kept per runner on its host (rustup, cargo home and target), so each check
      # after a runner's first is incremental; nothing lands in the shared home.
      - name: Rust toolchain, kept per runner
        if: steps.what.outputs.rust == 'true'
        working-directory: v2
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          if ! printf '%s' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::no pinned channel in v2/rust-toolchain.toml"; exit 1; fi
          keep="$HOME/.cache/souls-group-check/${RUNNER_NAME:-runner}"
          export RUSTUP_HOME="$keep/rustup" CARGO_HOME="$keep/cargo"
          if ! "$CARGO_HOME/bin/rustup" run "$channel" cargo --version > /dev/null 2>&1; then
            mkdir -p "$keep"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$keep/rustup-init.sh"
            sh "$keep/rustup-init.sh" -y --quiet --no-modify-path --profile minimal --default-toolchain "$channel" > /dev/null
          fi
          { echo "RUSTUP_HOME=$RUSTUP_HOME"; echo "CARGO_HOME=$CARGO_HOME"; echo "RUSTUP_TOOLCHAIN=$channel"; echo "CARGO_TARGET_DIR=$keep/target"; } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: The v2 workspace compiles
        if: steps.what.outputs.rust == 'true'
        working-directory: v2
        run: |
          start=$(date +%s)
          cargo check --workspace --all-targets --locked
          echo "cargo check: $(( $(date +%s) - start )) s"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.what.outputs.web == 'true'
        with: { dest: '${{ runner.temp }}/setup-pnpm' }
      - name: The web app type-checks
        if: steps.what.outputs.web == 'true'
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile
          npx tsc --noEmit -p apps/web
          echo "install and tsc: $(( $(date +%s) - start )) s"

  # The one required check: passes when every selected job passed (or none was needed). A deferred run (a draft with
  # heavy jobs selected) fails it: skipped heavy jobs never count as passing. On a pull_request and on a push the
  # `heavy: true` legs are never selected (the daily run and the release gate run them), so there it covers the jobs
  # that ran. In a merge group it waits for group-check alone: the PR entered the queue only with ci-ok green at its own
  # head, and the group's combined code must compile (B1-8).
  ci-ok:
    runs-on: ${{ vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    needs: [scope, repo, codex-files, qualify, smoke, group-check]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Full CI deferred
        if: needs.scope.outputs.deferred == 'true'
        env:
          WINDOW: ${{ needs.scope.outputs.window }}
        run: |
          echo "::error title=Full CI deferred::The CI window is closed for this PR ($WINDOW), so its heavy jobs did not run. Mark it ready for review to run them: docs/testing.md#ci-window"
          exit 1
      - env:
          SCOPE: ${{ needs.scope.result }}
          REPO: ${{ needs.repo.result }}
          QUALIFY: ${{ needs.qualify.result }}
          ANY: ${{ needs.scope.outputs.any }}
          SMOKE: ${{ needs.smoke.result }}
          SMOKE_SELECTED: ${{ needs.scope.outputs.smoke }}
          GREEN: ${{ needs.scope.outputs.green }}
          EVENT: ${{ github.event_name }}
          GROUP: ${{ needs.group-check.result }}
          CODEX_FILES: ${{ needs.codex-files.result }}
        run: |
          echo "scope=$SCOPE repo=$REPO codex_files=$CODEX_FILES qualify=$QUALIFY jobs_selected=$ANY smoke=$SMOKE smoke_selected=$SMOKE_SELECTED green_at_head=$GREEN"
          if [ "$EVENT" = merge_group ]; then echo "merge group: the PR's own ci-ok passed at its head; the combined code compiles: group-check=$GROUP"; test "$GROUP" = success; exit 0; fi
          test "$SCOPE" = success
          case "$CODEX_FILES" in failure|cancelled) echo "codex-files: $CODEX_FILES (#5068)"; exit 1;; esac
          if [ "$GREEN" = true ]; then test "$REPO" = skipped; else test "$REPO" = success; fi
          if [ "$ANY" = true ]; then test "$QUALIFY" = success; else test "$QUALIFY" = skipped; fi
          if [ "$SMOKE_SELECTED" = true ]; then test "$SMOKE" = success; else test "$SMOKE" = skipped; fi
