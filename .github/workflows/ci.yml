# Application checks on isolated runners, scoped to what a change touches. Pushes to main and manual runs are full scope
# (every qualify job and the local smoke): the merge train lands T0-T2 PRs without re-testing them only while main's
# latest full-scope run is green (.github/scripts/merge-train.mjs, mainCiState).
# The job matrix is the release gate's CPU contract split for GitHub runners; `scope` picks jobs with the same path
# map as `tools/test-harness/release-gate.mjs --scope auto` (.github/scripts/ci-scope.mjs). Branch protection requires
# the single `ci-ok` check. The full Modal gate still qualifies releases (release.yml); CI is the per-PR check.
# CI window (docs/testing.md#ci-window): a pull request run does its heavy jobs (qualify, smoke) only for a ready PR
# labelled merge:ready or ci:run; otherwise it runs scope and repo, and ci-ok fails as "full CI deferred" when heavy jobs
# were selected. Adding either label requests the run (ci-request.yml dispatches this workflow with `pr`), as does
# `gh workflow run ci.yml --ref <branch> -f pr=<n>`. A requested run is scoped by the PR's paths, not full scope.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Run this PR's path-scoped CI on its branch (the CI window); empty runs full scope
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Where tools/assets pull keeps its content-addressed download cache (restored by actions/cache below).
  SIM_ASSETS_CACHE: ${{ github.workspace }}/../.sim-assets-cache
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      any: ${{ steps.scope.outputs.any }}
      scope: ${{ steps.scope.outputs.scope }}
      smoke: ${{ steps.scope.outputs.smoke }}
      deferred: ${{ steps.scope.outputs.deferred }}
      window: ${{ steps.scope.outputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # A requested run queues behind any run already in its concurrency group; if that one passed at this head, the
      # heavy work is done (never re-run a passing check on the same tree).
      - id: green
        name: Already green at this head
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "green=$(node .github/scripts/ci-scope.mjs green --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --self "$GITHUB_RUN_ID")" >> "$GITHUB_OUTPUT"
      - id: scope
        name: Pick jobs from changed paths
        env:
          BASE: ${{ inputs.pr && format('origin/{0}', github.event.repository.default_branch) || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT: ${{ inputs.pr && 'request' || github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GREEN: ${{ steps.green.outputs.green || false }}
        # A push to main and a manual run check everything (FULL_EVENTS); the merge train reads those runs.
        run: node .github/scripts/ci-scope.mjs --base "$BASE" --head "$HEAD_SHA" --event "$EVENT" --draft "$DRAFT" --labels "$LABELS" --green-at-head "$GREEN"

  # Fast, dependency-free checks of the repo's own tooling; always runs.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Media manifest, CI scope, proof, merge train, restack, hooks, changelog and guard tests
        run: >-
          node --test --test-concurrency=1
          tools/assets/manifest.test.mjs
          tools/assets/mars-web.test.mjs
          .github/scripts/ci-scope.test.mjs
          .github/scripts/server-test-files.test.mjs
          .github/scripts/server-test-durations.test.mjs
          .github/scripts/guards.test.mjs
          .github/scripts/merge-train.test.mjs
          .github/scripts/restack.test.mjs
          .github/scripts/install-hooks.test.mjs
          tools/proof/tier.test.mjs
          tools/proof/gate.test.mjs
          tools/proof/acceptance.test.mjs
          tools/proof/upload.test.mjs
          tools/coordinator/status.test.mjs
          tools/changelog/compile.test.mjs
          e2e/local-smoke.test.mjs

  qualify:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.any == 'true'
    # The qualify jobs (no browser) run on the repository variable CI_HEAVY_RUNNER when it is set, else ubuntu-latest.
    # Its value is one runner label (`souls-ci`) or a JSON array of labels (`["self-hosted","souls-ci"]`).
    # `native` stays on ubuntu-latest: its camera perf budget is wall time, and a shared host under load misses it (#1162).
    runs-on: ${{ matrix.kind != 'native' && vars.CI_HEAVY_RUNNER && (startsWith(vars.CI_HEAVY_RUNNER, '[') && fromJSON(vars.CI_HEAVY_RUNNER) || vars.CI_HEAVY_RUNNER) || 'ubuntu-latest' }}
    # The recursive server inventory (about an hour of tests in all) runs in duration-balanced shards of ~10 minutes each.
    timeout-minutes: ${{ matrix.kind == 'server' && 45 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # pnpm's version comes from package.json `packageManager` (pnpm@10.27.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Instances on one host share a user and home, so the default dest would collide between concurrent jobs (#1162).
        with: { dest: '${{ runner.temp }}/setup-pnpm' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore media cache
        if: matrix.assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SIM_ASSETS_CACHE }}
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
          restore-keys: sim-assets-
      # Bounded: an object missing from the CDN (not yet published) fails the job with the list of paths, never hangs.
      - name: Pull media
        if: matrix.assets
        timeout-minutes: 15
        run: |
          if ! timeout 840 pnpm assets:pull --quiet; then
            echo "::error::Media pull failed or timed out. The paths above are missing from the CDN or failed verification against tools/assets/manifest.json; publish them first (tools/cdn/publish.mjs, see tools/assets/README.md), then re-run."
            exit 1
          fi
      - name: Run assigned checks
        env:
          CHECK_KIND: ${{ matrix.kind }}
          SERVER_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          case "$CHECK_KIND" in
            types-web)
              pnpm typecheck
              pnpm --filter @souls/web build
              # The Mars viewer's static site holds the people's character set (/modular); without it no world
              # draws people (issue #395). Build it as the first run does, then fail if the set is missing.
              pnpm build:viewer
              node tools/assets/mars-web.mjs --check
              ;;
            packages)
              pnpm -r --filter '!mars-campus-viewer' --filter '!@souls/server' test
              ;;
            native)
              pnpm test:mars
              ;;
            web)
              # V4-web: every apps/web unit test, TSX included
              bash tools/test-harness/web-suite.sh
              ;;
            launcher)
              # V3-launcher-unit; launcher.test.mjs takes its ports from LAUNCHER_TEST_PORT_BASE (default 6200)
              node --test --test-concurrency=1 tools/world-launcher/*.test.mjs
              ;;
            client-cli)
              # V3-client-cli
              pnpm test:client
              ;;
            latency)
              pnpm --filter @souls/server exec node --test --test-concurrency=1 src/owner-response-milestones.test.ts
              ;;
            soul-actions)
              # #1061: not a gate step; picked by ci-scope.mjs from its own paths
              node --test --test-concurrency=4 tools/soul-actions/*.test.mjs
              ;;
            server)
              node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { serverTestFiles, serverShardPlan, SERVER_TEST_CONCURRENCY } from './.github/scripts/server-test-files.mjs';
          const all = serverTestFiles(), shard = Number(process.env.SERVER_SHARD);
          const { parallel, serial } = serverShardPlan(all, shard);
          console.log(JSON.stringify({ shard, totalServerFiles: all.length, files: [...parallel, ...serial], parallel: parallel.length, serial: serial.length, concurrency: SERVER_TEST_CONCURRENCY }));
          // ephemeral-port files in parallel, then the fixed-port files one at a time; both always run, either failing fails the job
          const run = (files, n) => { if (!files.length) return 0; const r = spawnSync('pnpm', ['--filter', '@souls/server', 'exec', process.execPath, '--test', `--test-concurrency=${n}`, ...files], { stdio: 'inherit' }); if (r.error) throw r.error; return r.status ?? 1; };
          const a = run(parallel, SERVER_TEST_CONCURRENCY), b = run(serial, 1);
          process.exit(a || b);
          NODE
              ;;
            *) echo "unknown check kind: $CHECK_KIND"; exit 1 ;;
          esac

  # The local smoke (e2e/local-smoke.mjs, docs/testing/e2e.md#local-smoke): an isolated fake-mind instance, the world
  # list and one world in headless Chromium (SwiftShader, no GPU), a person drawn, no console errors or failed requests.
  smoke:
    needs: scope
    if: needs.scope.outputs.smoke == 'true'
    # Always GitHub-hosted, whatever CI_HEAVY_RUNNER says: `playwright install --with-deps` installs Chromium's system
    # libraries through apt, which a self-hosted runner without root, or with an OS Playwright does not support, cannot do.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.e2e/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore media cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SIM_ASSETS_CACHE }}
          key: sim-assets-${{ hashFiles('tools/assets/manifest.json') }}
          restore-keys: sim-assets-
      - name: Pull media (web, runtime)
        timeout-minutes: 15
        run: timeout 840 pnpm assets:pull --quiet --set web,runtime
      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and its system libraries
        run: pnpm --filter mars-campus-viewer exec playwright install --with-deps --only-shell chromium
      - name: Local smoke
        timeout-minutes: 10
        run: node e2e/local-smoke.mjs --build --port 9950 --out .local/e2e/ci
      - name: Upload the summary and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-smoke
          path: |
            .local/e2e/ci/summary.json
            .local/e2e/ci/shots/
            .local/e2e/ci/launcher.log
          if-no-files-found: warn
          retention-days: 14

  # The one required check: passes when every selected job passed (or none was needed). A deferred run (CI window
  # closed, heavy jobs selected) fails it: skipped heavy jobs never count as passing.
  ci-ok:
    runs-on: ubuntu-latest
    needs: [scope, repo, qualify, smoke]
    if: always()
    steps:
      - name: Full CI deferred
        if: needs.scope.outputs.deferred == 'true'
        env:
          WINDOW: ${{ needs.scope.outputs.window }}
        run: |
          echo "::error title=Full CI deferred::The CI window is closed for this PR ($WINDOW), so its heavy jobs did not run. Mark it ready and add ci:run (or merge:ready) to run them: docs/testing.md#ci-window"
          exit 1
      - env:
          SCOPE: ${{ needs.scope.result }}
          REPO: ${{ needs.repo.result }}
          QUALIFY: ${{ needs.qualify.result }}
          ANY: ${{ needs.scope.outputs.any }}
          SMOKE: ${{ needs.smoke.result }}
          SMOKE_SELECTED: ${{ needs.scope.outputs.smoke }}
        run: |
          echo "scope=$SCOPE repo=$REPO qualify=$QUALIFY jobs_selected=$ANY smoke=$SMOKE smoke_selected=$SMOKE_SELECTED"
          test "$SCOPE" = success
          test "$REPO" = success
          if [ "$ANY" = true ]; then test "$QUALIFY" = success; else test "$QUALIFY" = skipped; fi
          if [ "$SMOKE_SELECTED" = true ]; then test "$SMOKE" = success; else test "$SMOKE" = skipped; fi
