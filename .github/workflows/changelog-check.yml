# The `fragment` check. It reports success on every pull request and merge group and never blocks (0.132 rules: a
# changelog fragment is not required, and style never blocks). A malformed fragment in changes/ is reported as a
# warning. It stays only because the `main` ruleset requires a check named `fragment`.
name: changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
concurrency:
  # Push events on one PR replace its older run; merge_group runs are never cancelled.
  group: changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fragment:
    runs-on: ${{ vars.CI_LIGHT_RUNNER && (startsWith(vars.CI_LIGHT_RUNNER, '[') && fromJSON(vars.CI_LIGHT_RUNNER) || vars.CI_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with: { node-version: 22 }
      - name: Validate fragments (advice only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          node tools/changelog/compile.mjs --check || echo "::warning::A changelog fragment in changes/ is malformed (changes/README.md). This never blocks."
