# One production release of the current main head, by manual dispatch (#1402):
#   preflight  required secrets/vars exist (fails fast, naming what is missing), the head is main, inputs are sane; when the
#              Soul client changed since the last release and is not stamped, a dry run stamps it, opens the stamp commit
#              as a pull request (branch release/stamp-<version>, merged through the queue) and stops there (gate the head it
#              merges as, then dispatch again), a real ship refuses; stamp.mjs --check must pass (#1969)
#   ship       in the `production` environment: tools/world-launcher/deploy/ship.sh, the committed root-only release:
#              snapshot, stage, boot rehearsal of every world, backup, probe, activate, healthz, walks, poster, stall,
#              cdn-walk. With dry_run (the DEFAULT) it runs `ship.sh --no-switch`: every step for real except the
#              activation, checked against the build that stays live; nothing goes live and publish does not run.
#              The web build renders the public changelog page from CHANGELOG.md with this release's section already
#              compiled in (a copy outside the tree, SIM_CHANGELOG_FILE; #393), so the page shows the release it ships.
#              After the health checks pass, a real ship posts one `release` item to the site feed (#1969)
#   publish    (real ships only) compiles changes/ into CHANGELOG.md (same section, same date), tags v<version> on the
#              shipped commit, creates the GitHub Release, and opens the changelog commit as a pull request (branch
#              release/changelog-<version>, as publish.yml); the main ruleset refuses direct pushes (#2028)
#
# Receipt (real ships only): the head's publishable release-receipt.json, as the one asset of a prerelease (default tag
# receipts-v<version>). The release owner derives it from the raw gate and V7 receipts, which carry device paths and
# never leave the machine: it holds only shas, the build id, statuses, counts, timestamps and the raw receipts' sha256,
# and ship-receipt.mjs refuses to write it unless it passes tools/proof/publication.mjs. One gate per head runs through
# gate.yml or the laptop; V7 needs real Chrome on a GPU, which the runner lacks, so this workflow runs no gate.
#   node tools/test-harness/ship-receipt.mjs receipt.json v7-receipt.json --public release-receipt.json
#   gh release create receipts-v0.123 --prerelease --title "receipts 0.123" release-receipt.json
# Dry run:  gh workflow run release.yml --ref main -f version=<next version>            (dry_run defaults to true)
# Ship:     gh workflow run release.yml --ref main -f version=<v> -f dry_run=false [-f date=<the dry run's date>]
#           [-f accept_host_codes=halted]
# A dry run takes no backup (nothing goes live, so there is nothing to roll back) and runs no install.sh. It leaves the
# staged release directory with its dependencies on the host, which a later real ship of the same build reuses. The
# rehearsal's database copies live in a mktemp dir of the run's own, removed when it ends.
#
# Secrets: DEPLOY_SSH_KEY, SIM_DEPLOY_KNOWN_HOSTS, SIM_PROBE_GOD_JSON (the release-probe world's god file) in the
#          production environment. Vars or secrets: SIM_DEPLOY_HOST, SIM_DEPLOY_USER. Optional var: SIM_ORIGIN
#          (default https://soul.game). The run's public artifact holds only result files that pass
#          tools/proof/publication.mjs; ship.log (which can name the host) never leaves the runner.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the changelog and tag (e.g. 0.123 or 0.123.1)
        required: true
      dry_run:
        description: ship.sh --no-switch (every step but the activation; the live build and the host's units stay as they are; no publish). false ships
        type: boolean
        default: true
      date:
        description: Release date (YYYY-MM-DD, UTC) in the changelog page and CHANGELOG.md; default today. Give a real ship the same date as its dry run of the same head, or the staged build differs and stage refuses
        required: false
      accept_host_codes:
        description: ship.sh --accept-host-codes (comma-separated, such as halted for a release that fixes a halted world)
        required: false
      eyes:
        description: Where the browser checks (probe, walks, poster, stall) run. laptop (default) = ship/eyes.mjs on a GPU workstation, handed over by commit status (#1438); runner = here, where no GPU holds their bars
        type: choice
        options: [laptop, runner]
        default: laptop
      client_version:
        description: Soul client version stamped when the client changed since the last release (default the last release's client, next patch)
        required: false
      receipts:
        description: Release tag holding the head's release-receipt.json (ship-receipt.mjs --public); default receipts-v<version>
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  SIM_ORIGIN: ${{ vars.SIM_ORIGIN || 'https://soul.game' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # a dry run pushes the client stamp branch release/stamp-<version> (#1969)
      pull-requests: write   # and opens its pull request
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      label: ${{ steps.refs.outputs.label }}
      date: ${{ steps.refs.outputs.date }}
      stamped: ${{ steps.refs.outputs.stamped }}
    steps:
      - name: Required secrets and variables
        env:
          # Environment secrets are not visible outside the production job, so only repo-level presence is checked
          # here for them; the ship job checks again inside the environment.
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          # masked even when set as variables, so no log names the host
          [ -z "$SIM_DEPLOY_HOST" ] || echo "::add-mask::$SIM_DEPLOY_HOST"
          missing=()
          for name in SIM_DEPLOY_HOST SIM_DEPLOY_USER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release is not configured. Missing: ${missing[*]}. Add them under Settings > Secrets and variables > Actions (SIM_DEPLOY_HOST/SIM_DEPLOY_USER may be variables). DEPLOY_SSH_KEY, SIM_DEPLOY_KNOWN_HOSTS and SIM_PROBE_GOD_JSON belong to the production environment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: refs
        name: Release head and label
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          ACCEPT: ${{ inputs.accept_host_codes }}
          DRY_RUN: ${{ inputs.dry_run }}
          DATE: ${{ inputs.date }}
          CLIENT: ${{ inputs.client_version }}
          PR_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || github.token }}   # as publish.yml: CI runs on the stamp pull request
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::Releases ship main only (got $REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "::error::version must look like 0.123 or 0.123.1 (got '$VERSION')"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::tag v$VERSION already exists"; exit 1; fi
          [[ -z "$ACCEPT" || "$ACCEPT" =~ ^[a-z][a-zA-Z0-9:_-]*(,[a-z][a-zA-Z0-9:_-]*)*$ ]] || { echo "::error::accept_host_codes: comma-separated host codes, such as halted"; exit 1; }
          # ship.sh's label (its output folder and backup prefix pre-r<label without dots>) is the version itself
          LABEL="$VERSION"; [ "$DRY_RUN" = false ] || LABEL="$VERSION-rehearsal"
          [ -n "$DATE" ] || DATE=$(date -u +%F)
          [[ "$DATE" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "::error::date must be YYYY-MM-DD (got '$DATE')"; exit 1; }
          node tools/changelog/compile.mjs --check
          # #1969: the client is stamped once per release, before the gate. A dry run stamps a changed, unstamped client, opens
          # the stamp commit as a pull request and ends (ship is skipped); the main ruleset requires its checks and the queue,
          # as for publish.yml's changelog. Once it merges, the gate, the dry run and the real ship run on main's head. A real
          # ship refuses an unstamped client. --check gates every dispatch.
          [[ -z "$CLIENT" || "$CLIENT" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::client_version must be digits and dots (got '$CLIENT')"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="$RUNNER_TEMP/stamp.txt"
          node tools/world-launcher/deploy/ship/release-client.mjs stamp --version "$VERSION" ${CLIENT:+--client "$CLIENT"} > "$stamp" \
            || { cat "$stamp"; echo "::error::client stamp refused or stamp.mjs --check failed (above): the release stops"; exit 1; }
          cat "$stamp"
          if [ "$(tail -1 "$stamp" | sed -n 's/.* stamped=//p')" = 1 ]; then
            [ "$DRY_RUN" != false ] || { echo "::error::the Soul client changed since the last release and is not stamped. Dispatch a dry run of $VERSION first: it opens the stamp pull request. Merge it, gate that head, then ship it"; exit 1; }
            branch="release/stamp-$VERSION"
            ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null || { echo "::error::$branch already exists: merge or close its pull request, then dispatch again"; exit 1; }
            git push origin "HEAD:refs/heads/$branch"
            GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$branch" --label no-changelog --title "release: stamp the Soul client for $VERSION" \
              --body "$(tail -1 "$stamp"): the client changed since the last release. Created by release.yml run $GITHUB_RUN_ID. Review and give it merge:ready; once it merges, gate main's head and dispatch the dry run again." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "stamped=1" >> "$GITHUB_OUTPUT"
            echo "Client stamp opened as a pull request (above); nothing else ran." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Soul $(tail -1 "$stamp")" >> "$GITHUB_STEP_SUMMARY"
          # One release date for the page the ship job builds and the CHANGELOG.md publish commits.
          { echo "sha=$(git rev-parse HEAD)"; echo "label=$LABEL"; echo "date=$DATE"; } >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION: head $(git rev-parse --short HEAD), label $LABEL, $([ "$DRY_RUN" = true ] && echo 'DRY RUN (ship.sh --no-switch, nothing goes live)' || echo 'REAL SHIP')" >> "$GITHUB_STEP_SUMMARY"

  ship:
    needs: preflight
    if: ${{ needs.preflight.outputs.stamped != '1' }}   # a dispatch that stamped the client ends at its pull request (#1969)
    runs-on: ubuntu-latest
    timeout-minutes: 240   # setup + the 20-min eyes wait + ship.sh + the 45-min verdict wait + margin, so the verdict and its rollback line always print
    environment: production
    permissions:
      contents: read
      statuses: write   # the release/ship handover status for ship/eyes.mjs (#1438)
    steps:
      - name: Deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SIM_DEPLOY_KNOWN_HOSTS: ${{ secrets.SIM_DEPLOY_KNOWN_HOSTS }}
          SIM_PROBE_GOD_JSON: ${{ secrets.SIM_PROBE_GOD_JSON }}
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          # masked even when set as a variable: release.sh prints its upload target, so ship's log would name the host
          [ -z "$SIM_DEPLOY_HOST" ] || echo "::add-mask::$SIM_DEPLOY_HOST"
          [ -z "$SIM_DEPLOY_USER" ] || echo "::add-mask::$SIM_DEPLOY_USER"
          missing=()
          for name in DEPLOY_SSH_KEY SIM_DEPLOY_KNOWN_HOSTS SIM_PROBE_GOD_JSON; do [ -n "${!name}" ] || missing+=("$name"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The production environment is missing: ${missing[*]} (a restricted deploy key, the host's known_hosts line, the release-probe world's god file)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.preflight.outputs.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Pull media
        timeout-minutes: 15
        run: |
          if ! timeout 840 pnpm assets:pull --quiet; then
            echo "::error::Media pull failed or timed out: the paths above are missing from the CDN or fail tools/assets/manifest.json. Publish them (tools/cdn/publish.mjs) before releasing."
            exit 1
          fi
      - name: Browsers for the probe and the live walks
        run: |
          # ship/poster-count.py classifies the poster frames with Pillow
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --user pillow
          # ship.sh's preflight needs PLAYWRIGHT_BROWSERS_PATH to hold a Chromium executable
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" pnpm --filter mars-campus-viewer exec playwright install --with-deps chromium
      - name: Mars web overlay
        timeout-minutes: 20
        run: |
          # release.sh's MARS_WEB_SRC: the viewer's static site, built from this commit, plus what the public origin serves
          # that git does not hold (the static and campus manifests, the Draco decoders, the campus model). /modular is
          # linked from this commit by release.sh itself.
          pnpm build:viewer
          node tools/playtest/arena/assets-overlay.mjs "$RUNNER_TEMP/mars-static" --only manifests,draco,browser --origin "$SIM_ORIGIN"
          web="$RUNNER_TEMP/mars-web"; mkdir -p "$web"
          for e in mars/viewer/dist/client/*; do ln -sfn "$PWD/$e" "$web/${e##*/}"; done
          for e in static-manifest.json campus-manifest.json draco browser; do ln -sfn "$RUNNER_TEMP/mars-static/$e" "$web/$e"; done
          echo "MARS_WEB_SRC=$web" >> "$GITHUB_ENV"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "::error::the build changed tracked files; ship.sh ships exactly HEAD"; git status --short; exit 1; fi
      - name: Receipts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.receipts || format('receipts-v{0}', inputs.version) }}
          REPO: ${{ github.repository }}
        run: |
          r="$RUNNER_TEMP/receipts"; mkdir -p "$r"
          gh release download "$TAG" -R "$REPO" -p release-receipt.json -D "$r" \
            || { echo "::error::No release-receipt.json in the release $TAG. Derive it with ship-receipt.mjs --public and upload it there first."; exit 1; }
          node tools/proof/publication.mjs "$r/release-receipt.json" || { echo "::error::release-receipt.json is not publishable: derive it with ship-receipt.mjs --public"; exit 1; }
          # ship.sh's preflight checks it for this exact head (root-release.mjs receipt)
          echo "SHIP_RECEIPTS=$r" >> "$GITHUB_ENV"
      - name: Probe world
        env:
          SIM_PROBE_GOD_JSON: ${{ secrets.SIM_PROBE_GOD_JSON }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/release-probe"
          printf '%s' "$SIM_PROBE_GOD_JSON" > "$RUNNER_TEMP/release-probe/.eden-god.json" && chmod 600 "$RUNNER_TEMP/release-probe/.eden-god.json"
          echo "SHIP_PROBE_CLI=$RUNNER_TEMP/release-probe" >> "$GITHUB_ENV"
      - name: Changelog page for this release
        env:
          VERSION: ${{ inputs.version }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          # #393: the web build renders the changelog page from this copy (vite.config.ts reads SIM_CHANGELOG_FILE),
          # with the shipped fragments folded in. The tree stays exactly HEAD; publish commits the same section later.
          node tools/changelog/compile.mjs --version "$VERSION" --date "$DATE" --out "$RUNNER_TEMP/CHANGELOG.md"
          grep -q "^## $VERSION " "$RUNNER_TEMP/CHANGELOG.md"
          echo "SIM_CHANGELOG_FILE=$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_ENV"
      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SIM_DEPLOY_KNOWN_HOSTS: ${{ secrets.SIM_DEPLOY_KNOWN_HOSTS }}
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SIM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          printf 'Host %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$SIM_DEPLOY_HOST" "$SIM_DEPLOY_USER" > ~/.ssh/config && chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes "$SIM_DEPLOY_USER@$SIM_DEPLOY_HOST" true 2>&1 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g'; exit "${PIPESTATUS[0]}"
      - name: Wait for the workstation's eyes
        if: ${{ inputs.eyes != 'runner' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.preflight.outputs.sha }}
          RUN: ${{ github.run_id }}.${{ github.run_attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # #1438: the runner has no GPU, so the probe, walks, poster and stall run on the release owner's workstation:
          #   node tools/world-launcher/deploy/ship/eyes.mjs --sha <this sha> --run <this run>
          # It answers release/eyes "ready" once its probe watches; nothing is staged before that. Fails closed.
          H=tools/world-launcher/deploy/ship/handover.mjs
          mode=no-switch; [ "$DRY_RUN" != false ] || mode=ship
          node $H post "$SHA" release/ship pending "run=$RUN mode=$mode waiting-for-eyes" --url "$URL"
          eyes="node tools/world-launcher/deploy/ship/eyes.mjs --sha $SHA --run $RUN --label ${{ needs.preflight.outputs.label }}"
          echo "::notice title=Start the workstation's eyes::$eyes"
          echo "Eyes: \`$eyes\`" >> "$GITHUB_STEP_SUMMARY"
          if ! node $H wait "$SHA" release/eyes --run "$RUN" --want ready --timeout-min 20 --every-s 20; then
            node $H post "$SHA" release/ship failure "run=$RUN stopped: no eyes" --url "$URL" || true
            echo "::error::No workstation eyes for run $RUN within 20 min: nothing was staged. Start ship/eyes.mjs, then dispatch again."
            exit 1
          fi
      - name: ship.sh
        env:
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
          SIM_DEPLOY_ENV: /nonexistent
          LABEL: ${{ needs.preflight.outputs.label }}
          SHA: ${{ needs.preflight.outputs.sha }}
          ACCEPT: ${{ inputs.accept_host_codes }}
          DRY_RUN: ${{ inputs.dry_run }}
          EYES: ${{ inputs.eyes }}
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}.${{ github.run_attempt }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export SHIP_ORIGIN="$SIM_ORIGIN" SHIP_OUT_ROOT="$RUNNER_TEMP/ship"
          args=(--label "$LABEL" --sha "$SHA")
          if [ "$EYES" != runner ]; then
            # the workstation runs the browser steps. Right before the activation its probe must still be watching (newest
            # release/eyes for this attempt is "ready"); right after, it is told. A failed tell is recorded, not a stop.
            args+=(--no-eyes)
            export SHIP_PREACTIVATE_CMD="node tools/world-launcher/deploy/ship/handover.mjs wait $SHA release/eyes --run $RUN --want ready --max-age-s 180 --timeout-min 1 --every-s 20"
            export SHIP_RELEASED_CMD="node tools/world-launcher/deploy/ship/handover.mjs post $SHA release/ship success 'run=$RUN released' --url '$URL'"
          fi
          # fails closed: only an explicit false ships
          [ "$DRY_RUN" = false ] || args+=(--no-switch)
          [ -z "$ACCEPT" ] || args+=(--accept-host-codes "$ACCEPT")
          ( while sleep 300; do echo "ship still running ($(date -u +%H:%MZ))"; done ) & beat=$!
          set +e
          # The host is a secret, so the log masks it; an address ssh prints is filtered here too.
          tools/world-launcher/deploy/ship.sh "${args[@]}" 2>&1 | sed -u -E -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' -e 's/\[[0-9a-fA-F:]*:[0-9a-fA-F:]+\]/<ip6>/g'
          status=${PIPESTATUS[0]}
          kill $beat
          out="$SHIP_OUT_ROOT/$LABEL"
          # the summary is public: only the status word, and only the whole result once it passes the publication check
          if [ -f "$out/ship-result.json" ]; then
            echo "ship.sh: $(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).status.replace(/[^a-z-]/g, '')" "$out/ship-result.json")" >> "$GITHUB_STEP_SUMMARY"
            if node tools/proof/publication.mjs "$out/ship-result.json" > /dev/null 2>&1; then { echo '```json'; cat "$out/ship-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          fi
          # released = the activation ran (or its no-switch skip), whatever the hook managed to say. A stop once the host
          # activation began (ACTIVATING), other than the host's own refusal (exit 80), leaves the live build unknown.
          detail=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).detail" "$out/ship-result.json" 2>/dev/null || true)
          if [ "$EYES" != runner ] && ! grep -qE '^activate (ok|skipped-no-switch) ' "$out/STEPS.txt" 2>/dev/null; then
            if [ -e "$out/ACTIVATING" ] && [ "$detail" != "activate exit 80" ]; then
              node tools/world-launcher/deploy/ship/handover.mjs post "$SHA" release/ship failure "run=$RUN stopped: at the activation, live state unknown" --url "$URL" || true
            else
              node tools/world-launcher/deploy/ship/handover.mjs post "$SHA" release/ship failure "run=$RUN stopped: ship.sh exit $status before the release" --url "$URL" || true
            fi
          fi
          # activated, but ship.sh could not tell the workstation: tell it once more, so its checks still run
          if [ "$EYES" != runner ] && grep -q '^released-hook 1$' "$out/POSTLIVE.txt" 2>/dev/null; then
            node tools/world-launcher/deploy/ship/handover.mjs post "$SHA" release/ship success "run=$RUN released" --url "$URL" || echo "::warning::could not tell the workstation the release is done; its verdict will time out (fail closed)"
          fi
          exit $status
      - name: The workstation's verdict
        if: ${{ inputs.eyes != 'runner' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.preflight.outputs.sha }}
          RUN: ${{ github.run_id }}.${{ github.run_attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
          LABEL: ${{ needs.preflight.outputs.label }}
        run: |
          # Fails closed: no pass from ship/eyes.mjs for this run means no publish. After a real activation the summary
          # names the code-only rollback, which needs no ssh (rollback.yml, ship.sh's ROLLBACK.txt).
          out="$RUNNER_TEMP/ship/$LABEL" steps="$RUNNER_TEMP/ship/$LABEL/STEPS.txt"
          rollback_line() {
            prev=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).previousBuild" "$out/snapshot.json" 2>/dev/null || echo '<previous build>')
            echo "gh workflow run rollback.yml --ref main -f build=$prev -f from=we-${SHA:0:12}"
          }
          if ! grep -qE '^activate (ok|skipped-no-switch) ' "$steps" 2>/dev/null; then
            detail=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).detail" "$out/ship-result.json" 2>/dev/null || true)
            if [ -e "$out/ACTIVATING" ] && [ "$detail" != "activate exit 80" ]; then
              cmd=$(rollback_line)
              { echo "LIVE STATE UNKNOWN: ship.sh stopped at the activation ($detail). Read its STOPPED line in the ship.sh step and healthz; if we-${SHA:0:12} is live and should not be, roll back (no ssh, no data touched):"; echo; echo "    $cmd"; } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::stopped at the activation ($detail): the live build is unknown. See the STOPPED line above and healthz. Rollback if needed: $cmd"
            else
              echo "::error::nothing was activated (no eyes, or ship.sh stopped before the activation); nothing to publish"
            fi
            exit 1
          fi
          if node tools/world-launcher/deploy/ship/handover.mjs wait "$SHA" release/eyes --run "$RUN" --want final --timeout-min 45 --every-s 30; then
            echo "eyes: pass" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "eyes: FAIL or no verdict in 45 min" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = false ]; then
            cmd=$(rollback_line)
            { echo "The release IS live and its browser checks failed. Decide; to roll code back (no ssh, no data touched):"; echo; echo "    $cmd"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::we-${SHA:0:12} is live and the workstation's checks failed or never reported. Rollback: $cmd"
          else
            echo "::error::the workstation's checks failed or never reported (dry run: nothing went live)"
          fi
          exit 1
      - name: Feed
        if: ${{ success() && !inputs.dry_run }}
        continue-on-error: true   # the release is live and stays live; a failed post is a warning with the command to retry
        env:
          VERSION: ${{ inputs.version }}
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          # #1969: the health checks passed. One `release` item (the client version, the changelog link, minClient when the
          # minimum was raised) on the site feed, through the operator route on the host, which answers loopback only. A retry
          # finds the item already posted for this version and posts nothing.
          set +e
          node tools/world-launcher/deploy/ship/release-client.mjs feed --version "$VERSION" --origin "$SIM_ORIGIN" --ssh "$SIM_DEPLOY_USER@$SIM_DEPLOY_HOST" 2>&1 | sed -E -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' -e 's/\[[0-9a-fA-F:]*:[0-9a-fA-F:]+\]/<ip6>/g'
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || echo "::warning::the release item was not posted to the feed. Retry: node tools/world-launcher/deploy/ship/release-client.mjs feed --version $VERSION --origin $SIM_ORIGIN --ssh <deploy target>"
          exit "$rc"
      - name: Public evidence
        if: always()
        env:
          LABEL: ${{ needs.preflight.outputs.label }}
        run: |
          # Only result files that pass the publication check; ship.log and every raw log stay on the runner.
          out="$RUNNER_TEMP/ship/$LABEL" pub="$RUNNER_TEMP/public"; mkdir -p "$pub"
          # the probe's bar alone (counts, page paths, build ids), so a probe failure can be read from the artifact
          [ ! -f "$out/probe/report.json" ] || node -e 'const fs=require("fs");fs.writeFileSync(process.argv[2],JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1])).bar,null,1)+"\n")' "$out/probe/report.json" "$out/probe-bar.json" || true
          for f in STEPS.txt POSTLIVE.txt ship-result.json rehearse.json probe-bar.json walks-check.txt poster-check.txt stall-check.txt; do
            [ -f "$out/$f" ] || continue
            if node tools/proof/publication.mjs "$out/$f" > /dev/null 2>&1; then cp "$out/$f" "$pub/"; else echo "kept private: $f (publication check)"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ship-${{ needs.preflight.outputs.label }}
          path: ${{ runner.temp }}/public
          if-no-files-found: ignore
      - name: Remove deploy credentials
        if: always()
        run: rm -rf ~/.ssh/deploy_key "$RUNNER_TEMP/release-probe" "$RUNNER_TEMP/receipts"

  publish:
    needs: [preflight, ship]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the tag and the branch release/changelog-<version>
      pull-requests: write   # the changelog pull request (#2028)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Changelog, tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || github.token }}   # as publish.yml: CI runs on the changelog pull request
          VERSION: ${{ inputs.version }}
          DATE: ${{ needs.preflight.outputs.date }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fold the fragments as of the shipped commit; fragments merged during the release wait for the next one.
          shipped=$(git ls-tree --name-only "$SHA" changes/ | grep -vE '^changes/(README|_template)\.md$' | grep -E '\.md$' || true)
          tmp="$RUNNER_TEMP/changelog"; rm -rf "$tmp"; mkdir -p "$tmp/changes"
          for f in $shipped; do git show "$SHA:$f" > "$tmp/$f"; done
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$tmp/"; fi
          node tools/changelog/compile.mjs --root "$tmp" --version "$VERSION" --date "$DATE" --notes "$RUNNER_TEMP/notes.md"
          git tag -a "v$VERSION" "$SHA" -m "Souls $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "Souls $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Tagged v$VERSION and created the GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          # #2028: the changelog commit, as a pull request against main (the ruleset requires checks and the merge queue).
          branch="release/changelog-$VERSION"
          git checkout -q -b "$branch"
          cp "$tmp/CHANGELOG.md" CHANGELOG.md
          for f in $shipped; do git rm -q --ignore-unmatch "$f"; done
          git add CHANGELOG.md
          git commit -q -m "release: changelog for $VERSION" -m "Folds the shipped changes/ fragments into CHANGELOG.md (v$VERSION at ${SHA:0:12})."
          git push -u origin "$branch"
          GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$branch" --label no-changelog --title "release: changelog for $VERSION" \
            --body "Folds the fragments shipped in v$VERSION (${SHA:0:12}) into CHANGELOG.md. Created by release.yml run $GITHUB_RUN_ID. Review and give it merge:ready." \
            | tee -a "$GITHUB_STEP_SUMMARY"
