# One production release of the current main head, by manual dispatch (#1402):
#   preflight  required secrets/vars exist (fails fast, naming what is missing), the head is main, inputs are sane
#   ship       in the `production` environment: tools/world-launcher/deploy/ship.sh, the committed root-only release:
#              snapshot, stage, boot rehearsal of every world, backup, probe, activate, healthz, walks, poster, stall,
#              cdn-walk. With dry_run (the DEFAULT) it runs `ship.sh --no-switch`: every step for real except the
#              activation, checked against the build that stays live; nothing goes live and publish does not run.
#              The web build renders the public changelog page from CHANGELOG.md with this release's section already
#              compiled in (a copy outside the tree, SIM_CHANGELOG_FILE; #393), so the page shows the release it ships
#   publish    (real ships only) compiles changes/ into CHANGELOG.md (same section, same date), tags v<version> on the
#              shipped commit, creates the GitHub Release
#
# Receipts (real ships only): the head's full gate receipt.json and its V7 v7-receipt.json, as assets of a DRAFT GitHub
# release (default tag receipts-v<version>; drafts are visible only to maintainers, and the receipts carry device
# paths, so never publish that release). One gate per head runs through gate.yml or the laptop; V7 needs real Chrome on
# a GPU, which the runner lacks, so this workflow runs no gate of its own. The ship job combines them
# (tools/test-harness/ship-receipt.mjs) and ship.sh's preflight checks them for this exact head.
#   gh release create receipts-v4.17 --draft --title "receipts 4.17" receipt.json v7-receipt.json
# Dry run:  gh workflow run release.yml --ref main -f version=<next version>            (dry_run defaults to true)
# Ship:     gh workflow run release.yml --ref main -f version=<v> -f dry_run=false [-f accept_host_codes=halted]
#
# Secrets: DEPLOY_SSH_KEY, SIM_DEPLOY_KNOWN_HOSTS, SIM_PROBE_GOD_JSON (the release-probe world's god file) in the
#          production environment. Vars or secrets: SIM_DEPLOY_HOST, SIM_DEPLOY_USER. Optional var: SIM_ORIGIN
#          (default https://soul.game). The run's public artifact holds only result files that pass
#          tools/proof/publication.mjs; ship.log (which can name the host) never leaves the runner.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the changelog and tag (e.g. 4.0.1)
        required: true
      dry_run:
        description: ship.sh --no-switch (every step but the activation; nothing goes live, no publish). false ships
        type: boolean
        default: true
      accept_host_codes:
        description: ship.sh --accept-host-codes (comma-separated, such as halted for a release that fixes a halted world)
        required: false
      receipts:
        description: Draft release tag holding receipt.json and v7-receipt.json for the head; default receipts-v<version>
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  SIM_ORIGIN: ${{ vars.SIM_ORIGIN || 'https://soul.game' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.refs.outputs.sha }}
      label: ${{ steps.refs.outputs.label }}
      date: ${{ steps.refs.outputs.date }}
    steps:
      - name: Required secrets and variables
        env:
          # Environment secrets are not visible outside the production job, so only repo-level presence is checked
          # here for them; the ship job checks again inside the environment.
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          missing=()
          for name in SIM_DEPLOY_HOST SIM_DEPLOY_USER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release is not configured. Missing: ${missing[*]}. Add them under Settings > Secrets and variables > Actions (SIM_DEPLOY_HOST/SIM_DEPLOY_USER may be variables). DEPLOY_SSH_KEY, SIM_DEPLOY_KNOWN_HOSTS and SIM_PROBE_GOD_JSON belong to the production environment."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: refs
        name: Release head and label
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          ACCEPT: ${{ inputs.accept_host_codes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::Releases ship main only (got $REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "::error::version must look like 4.0 or 4.0.1 (got '$VERSION')"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::tag v$VERSION already exists"; exit 1; fi
          [[ -z "$ACCEPT" || "$ACCEPT" =~ ^[a-z][a-zA-Z0-9:_-]*(,[a-z][a-zA-Z0-9:_-]*)*$ ]] || { echo "::error::accept_host_codes: comma-separated host codes, such as halted"; exit 1; }
          # ship.sh's label (its output folder and backup prefix pre-r<label without dots>) is the version itself
          LABEL="$VERSION"; [ "$DRY_RUN" = true ] && LABEL="$VERSION-rehearsal"
          node tools/changelog/compile.mjs --check
          # One release date for the page the ship job builds and the CHANGELOG.md publish commits.
          { echo "sha=$(git rev-parse HEAD)"; echo "label=$LABEL"; echo "date=$(date -u +%F)"; } >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION: head $(git rev-parse --short HEAD), label $LABEL, $([ "$DRY_RUN" = true ] && echo 'DRY RUN (ship.sh --no-switch, nothing goes live)' || echo 'REAL SHIP')" >> "$GITHUB_STEP_SUMMARY"

  ship:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    # contents: write only so the receipts download can read a DRAFT release (drafts are invisible to a read token).
    # The token is never persisted into the checkout and reaches that one step alone.
    permissions:
      contents: write
    steps:
      - name: Deploy secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SIM_DEPLOY_KNOWN_HOSTS: ${{ secrets.SIM_DEPLOY_KNOWN_HOSTS }}
          SIM_PROBE_GOD_JSON: ${{ secrets.SIM_PROBE_GOD_JSON }}
        run: |
          missing=()
          for name in DEPLOY_SSH_KEY SIM_DEPLOY_KNOWN_HOSTS SIM_PROBE_GOD_JSON; do [ -n "${!name}" ] || missing+=("$name"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The production environment is missing: ${missing[*]} (a restricted deploy key, the host's known_hosts line, the release-probe world's god file)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.preflight.outputs.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Pull media
        timeout-minutes: 15
        run: |
          if ! timeout 840 pnpm assets:pull --quiet; then
            echo "::error::Media pull failed or timed out: the paths above are missing from the CDN or fail tools/assets/manifest.json. Publish them (tools/cdn/publish.mjs) before releasing."
            exit 1
          fi
      - name: Browsers for the probe and the live walks
        run: |
          # ship.sh's preflight needs PLAYWRIGHT_BROWSERS_PATH to hold a Chromium executable
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" pnpm --filter mars-campus-viewer exec playwright install --with-deps chromium
      - name: Mars web overlay
        timeout-minutes: 20
        run: |
          # release.sh's MARS_WEB_SRC: the viewer's static site, built from this commit, plus what the public origin serves
          # that git does not hold (the static and campus manifests, the Draco decoders, the campus model). /modular is
          # linked from this commit by release.sh itself.
          pnpm build:viewer
          node tools/playtest/arena/assets-overlay.mjs "$RUNNER_TEMP/mars-static" --only manifests,draco,browser --origin "$SIM_ORIGIN"
          web="$RUNNER_TEMP/mars-web"; mkdir -p "$web"
          for e in mars/viewer/dist/client/*; do ln -sfn "$PWD/$e" "$web/${e##*/}"; done
          for e in static-manifest.json campus-manifest.json draco browser; do ln -sfn "$RUNNER_TEMP/mars-static/$e" "$web/$e"; done
          echo "MARS_WEB_SRC=$web" >> "$GITHUB_ENV"
          git status --porcelain --untracked-files=no | grep -q . && { echo "::error::the build changed tracked files; ship.sh ships exactly HEAD"; git status --short; exit 1; } || true
      - name: Receipts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.receipts || format('receipts-v{0}', inputs.version) }}
          REPO: ${{ github.repository }}
        run: |
          r="$RUNNER_TEMP/receipts"; mkdir -p "$r"
          gh release download "$TAG" -R "$REPO" -p receipt.json -p v7-receipt.json -D "$r" \
            || { echo "::error::No receipt.json and v7-receipt.json in the draft release $TAG. Upload the head's full gate and V7 receipts there first."; exit 1; }
          [ "$(gh release view "$TAG" -R "$REPO" --json isDraft -q .isDraft)" = true ] || { echo "::error::$TAG is published: the receipts carry device paths, so they belong in a draft release only"; exit 1; }
          node tools/test-harness/ship-receipt.mjs "$r/receipt.json" "$r/v7-receipt.json" --out "$r/ship-receipt.json"
          echo "SHIP_RECEIPTS=$r" >> "$GITHUB_ENV"
      - name: Probe world
        env:
          SIM_PROBE_GOD_JSON: ${{ secrets.SIM_PROBE_GOD_JSON }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/release-probe"
          printf '%s' "$SIM_PROBE_GOD_JSON" > "$RUNNER_TEMP/release-probe/.eden-god.json" && chmod 600 "$RUNNER_TEMP/release-probe/.eden-god.json"
          echo "SHIP_PROBE_CLI=$RUNNER_TEMP/release-probe" >> "$GITHUB_ENV"
      - name: Changelog page for this release
        env:
          VERSION: ${{ inputs.version }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          # #393: the web build renders the changelog page from this copy (vite.config.ts reads SIM_CHANGELOG_FILE),
          # with the shipped fragments folded in. The tree stays exactly HEAD; publish commits the same section later.
          node tools/changelog/compile.mjs --version "$VERSION" --date "$DATE" --out "$RUNNER_TEMP/CHANGELOG.md"
          grep -q "^## $VERSION " "$RUNNER_TEMP/CHANGELOG.md"
          echo "SIM_CHANGELOG_FILE=$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_ENV"
      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SIM_DEPLOY_KNOWN_HOSTS: ${{ secrets.SIM_DEPLOY_KNOWN_HOSTS }}
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SIM_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          printf 'Host %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$SIM_DEPLOY_HOST" "$SIM_DEPLOY_USER" > ~/.ssh/config && chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes "$SIM_DEPLOY_USER@$SIM_DEPLOY_HOST" true 2>&1 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g'; exit "${PIPESTATUS[0]}"
      - name: ship.sh
        env:
          SIM_DEPLOY_HOST: ${{ vars.SIM_DEPLOY_HOST || secrets.SIM_DEPLOY_HOST }}
          SIM_DEPLOY_USER: ${{ vars.SIM_DEPLOY_USER || secrets.SIM_DEPLOY_USER }}
          SIM_DEPLOY_ENV: /nonexistent
          LABEL: ${{ needs.preflight.outputs.label }}
          SHA: ${{ needs.preflight.outputs.sha }}
          ACCEPT: ${{ inputs.accept_host_codes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export SHIP_ORIGIN="$SIM_ORIGIN" SHIP_OUT_ROOT="$RUNNER_TEMP/ship"
          args=(--label "$LABEL" --sha "$SHA")
          [ "$DRY_RUN" = true ] && args+=(--no-switch)
          [ -z "$ACCEPT" ] || args+=(--accept-host-codes "$ACCEPT")
          ( while sleep 300; do echo "ship still running ($(date -u +%H:%MZ))"; done ) & beat=$!
          set +e
          # The host is a secret, so the log masks it; an address ssh prints is filtered here too.
          tools/world-launcher/deploy/ship.sh "${args[@]}" 2>&1 | sed -u -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g'
          status=${PIPESTATUS[0]}
          kill $beat
          out="$SHIP_OUT_ROOT/$LABEL"
          [ -f "$out/ship-result.json" ] && { echo '```json'; cat "$out/ship-result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Public evidence
        if: always()
        env:
          LABEL: ${{ needs.preflight.outputs.label }}
        run: |
          # Only result files that pass the publication check; ship.log and every raw log stay on the runner.
          out="$RUNNER_TEMP/ship/$LABEL" pub="$RUNNER_TEMP/public"; mkdir -p "$pub"
          for f in STEPS.txt POSTLIVE.txt ship-result.json rehearse.json walks-check.txt poster-check.txt stall-check.txt; do
            [ -f "$out/$f" ] || continue
            if node tools/proof/publication.mjs "$out/$f" > /dev/null 2>&1; then cp "$out/$f" "$pub/"; else echo "kept private: $f (publication check)"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ship-${{ needs.preflight.outputs.label }}
          path: ${{ runner.temp }}/public
          if-no-files-found: ignore
      - name: Remove deploy credentials
        if: always()
        run: rm -rf ~/.ssh/deploy_key "$RUNNER_TEMP/release-probe" "$RUNNER_TEMP/receipts"

  publish:
    needs: [preflight, ship]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Changelog, tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DATE: ${{ needs.preflight.outputs.date }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fold the fragments as of the shipped commit; fragments merged during the release wait for the next one.
          shipped=$(git ls-tree --name-only "$SHA" changes/ | grep -vE '^changes/(README|_template)\.md$' | grep -E '\.md$' || true)
          tmp="$RUNNER_TEMP/changelog"; rm -rf "$tmp"; mkdir -p "$tmp/changes"
          for f in $shipped; do git show "$SHA:$f" > "$tmp/$f"; done
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$tmp/"; fi
          node tools/changelog/compile.mjs --root "$tmp" --version "$VERSION" --date "$DATE" --notes "$RUNNER_TEMP/notes.md"
          cp "$tmp/CHANGELOG.md" CHANGELOG.md
          for f in $shipped; do git rm -q --ignore-unmatch "$f"; done
          git add CHANGELOG.md
          git tag -a "v$VERSION" "$SHA" -m "Souls $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "Souls $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          git commit -q -m "release: changelog for $VERSION" -m "Folds the shipped changes/ fragments into CHANGELOG.md."
          # main may have moved during the release; replay the changelog commit on top.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Released and tagged v$VERSION, but could not push the changelog commit to main (branch protection?). Open a PR from this run's diff."
          exit 1
