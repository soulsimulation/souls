# Keeps main's committed Soul client current and stamped: tools/world-launcher/soul/eden.mjs what inline.mjs builds
# from its modules (soul/*.mjs and packages/form-rules/src/rules.ts), and, once the client changed since the last
# release, stamped with the next client version (release-client.mjs stamp: eden.mjs, skill.md and SOURCES.json). Pull
# requests do not carry a rebuilt eden.mjs (docs/testing.md#the-soul-client-file); CI builds it before every check. The
# stamp is made here, on main, before a release head is picked (0.133 R13): release.yml only checks it, so a release
# never makes a new head that needs CI again.
#
# After a push to main that leaves the client stale or unstamped, it opens one pull request (branch
# bot/eden-sync-<sha12>) carrying only those files, labelled no-changelog and merge:ready, so the merge train lands it
# like any other T1 change. An open sync PR that already carries the same files is kept; an older one is closed with its
# branch. Nothing
# is pushed to main directly (the main ruleset refuses it). The PR is created with MERGE_TRAIN_TOKEN when present, as
# publish.yml does, so CI and the merge train run on it; with github.token alone it opens, but CI waits for a push.
name: eden-sync
on:
  push:
    branches: [main]
    paths:
      - tools/world-launcher/soul/*.mjs
      - tools/world-launcher/soul/skill.md
      - packages/form-rules/src/**
      - .github/workflows/eden-sync.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: eden-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the stamp compares with the last release tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Build eden.mjs from its modules and stamp the client
        id: build
        run: |
          set -o pipefail
          node tools/world-launcher/deploy/ship/release-client.mjs stamp | tee "$RUNNER_TEMP/stamp.txt"
          if git diff --quiet -- tools/world-launcher/soul/eden.mjs tools/world-launcher/soul/skill.md tools/world-launcher/soul/SOURCES.json; then
            echo "the client on main is current and stamped" >> "$GITHUB_STEP_SUMMARY"; echo "stale=0" >> "$GITHUB_OUTPUT"
          else echo "stale=1" >> "$GITHUB_OUTPUT"; echo "client=$(tail -1 "$RUNNER_TEMP/stamp.txt" | sed -n 's/^client=\([0-9.]*\).*/\1/p')" >> "$GITHUB_OUTPUT"; fi
      - name: Open the sync pull request
        if: steps.build.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || github.token }}
          CLIENT: ${{ steps.build.outputs.client }}
        run: |
          set -euo pipefail
          files="tools/world-launcher/soul/eden.mjs tools/world-launcher/soul/skill.md tools/world-launcher/soul/SOURCES.json"
          sha=$(git rev-parse HEAD); short=${sha:0:12}
          for pr in $(gh pr list --state open --limit 50 --json number,headRefName -q '.[] | select(.headRefName | startswith("bot/eden-sync-")) | .number'); do
            ref=$(gh pr view "$pr" --json headRefName -q .headRefName)
            git fetch -q origin "refs/heads/$ref"
            # shellcheck disable=SC2086 # the three files, one argument each
            if git diff --quiet FETCH_HEAD -- $files; then
              echo "#$pr already carries this client" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            gh pr close "$pr" --delete-branch --comment "Superseded: main is now $short and the client builds or stamps differently; a new sync pull request follows."
          done
          branch="bot/eden-sync-$short"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          # shellcheck disable=SC2086
          git commit -q -m "chore(soul): rebuild eden.mjs from its modules and stamp client $CLIENT at $short" -m "node tools/world-launcher/deploy/ship/release-client.mjs stamp on main $sha (eden-sync.yml run $GITHUB_RUN_ID)." -- $files
          git push -q origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Problem

          The Soul client on main ($short) is stale or unstamped: a merged change edited a module
          (tools/world-launcher/soul/*.mjs or packages/form-rules/src/rules.ts) and, as intended, did not carry the
          rebuilt eden.mjs, or the client changed since the last release and needs its next version (client $CLIENT).
          Opened by eden-sync.yml run $GITHUB_RUN_ID; see docs/testing.md#the-soul-client-file.

          ## Acceptance

          - [x] **A1** The PR changes only the client's eden.mjs, skill.md and SOURCES.json: eden.mjs is what inline.mjs builds from main $short, stamped $CLIENT when the client changed since the last release — evidence: \`node tools/world-launcher/deploy/ship/release-client.mjs stamp\` on $sha, then \`node tools/world-launcher/soul/stamp.mjs --check\` -> exit 0 at this head

          ## Proof

          Tier: T1
          - proof.json: none; CI on this head is the proof (a generated file)
          - clips: none (no journey changes; the client is what the merged modules already define)
          - images: none

          ## Self-audit

          - **Checks run**: \`release-client.mjs stamp\` -> eden.mjs rebuilt and stamped; CI runs every check on this head
          - **Failed attempts**: none
          - **Long tail / externalities**: none; one generated file
          - **Known limits**: a later push to main that changes a module again replaces this PR with a newer one
          - **Docs**: none needed

          ## Changelog

          no-changelog: a generated file

          ## Risk

          None beyond the merged modules it reflects. Rollback: revert, then eden-sync.yml opens it again.
          EOF
          GH_TOKEN="$PR_TOKEN" gh pr create --base main --head "$branch" --label no-changelog --label merge:ready \
            --title "chore(soul): rebuild eden.mjs from its modules and stamp client $CLIENT at $short" --body-file "$RUNNER_TEMP/body.md"
          echo "Opened the sync pull request for $branch" >> "$GITHUB_STEP_SUMMARY"
