# The `proof-ok` check. It reports success on every pull request and merge group and never blocks (0.132 rules: no
# proof tier, journal entry or maintainer sign-off is required to merge; style and description never block). It stays
# only because the `main` ruleset requires a check named `proof-ok`. `node tools/proof/acceptance.mjs check` still gives
# advice on a PR body locally.
name: proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
concurrency:
  # Each merge group has its own ref, and its run is never cancelled: a missing check would stall the queue.
  group: proof-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  proof-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: proof-ok
        run: echo "proof-ok is advisory only and never blocks (docs/process/agent-workflow.md)"
