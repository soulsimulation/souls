    <div id="root"></div>
    <!-- QA F12, #1166: a world page shows the arrival light from its first paint (main.css is in), not a blank page until
         its JavaScript runs (old /w/eden on a 4G phone: ~4 s): black, a white disc, the words and an empty bar. It sits
         beside #root and goes once the app's own light is up, or once the app has drawn something else for 0.6 s. A phone's
         early poster is often up before the app's code has downloaded, and must not wait for it, so this finishes the
         arrival itself: the disc grows to white, then dissolves. -->
    <script>(function(){try{if(!/\/w\/[a-z][a-z0-9-]{0,31}(\/|$)/.test(location.pathname)||/[?&]shot=/.test(location.search))return;var d=document,r=d.getElementById('root'),b=d.createElement('div');b.id='boot-arrival';b.className='viewer-arrival';b.setAttribute('role','status');b.setAttribute('aria-live','polite');b.innerHTML='<div class="arrival-disc" aria-hidden="true"></div><div class="arrival-text"><p class="viewer-arrival-title">Loading the world</p><div class="viewer-arrival-progress"><progress aria-label="World loading progress" max="1000" value="0"></progress><span></span></div></div>';var c=window.__simConfig,n=c&&c.worldName;if(typeof n==='string'&&n)b.querySelector('.viewer-arrival-title').textContent='Loading '+n;d.body.appendChild(b);var t0=0,iv=setInterval(function(){var now=Date.now();if(d.querySelector('.early-world-poster')){clearInterval(iv);var q=b.querySelector('progress'),s=b.querySelector('.viewer-arrival-progress span'),k=b.querySelector('.arrival-disc');q.value=1000;s.textContent='100%';b.dataset.fill='true';k.style.setProperty('--s',String(Math.hypot(innerWidth,innerHeight)/292));setTimeout(function(){b.dataset.white=b.dataset.dissolving='true';setTimeout(function(){b.remove();},2000);},1200);}else if(d.querySelector('#root .viewer-arrival')||(r&&r.firstElementChild&&(t0=t0||now)&&now-t0>600)){clearInterval(iv);b.remove();}},50);}catch(e){}})()</script>
