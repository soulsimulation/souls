[package]
name = "bench"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Engine v2 benches, run by hand and declared in their task's issue (Engine v2, #2635). `tree`: K2, #2646; `frozen`: K8, #2671; `timers`: K9, #2672; `moves`: B2, #2681; `view-tier`: R3, #2697; `subscription`: R4, #2698; `gateway-restart`: I1, #2683; `seats`: B3, #2682."

[[bin]]
name = "seats"
path = "src/seats.rs"

[[bin]]
name = "tree"
path = "src/tree.rs"

[[bin]]
name = "view-tier"
path = "view-tier/main.rs"

[[bin]]
name = "subscription"
path = "subscription/main.rs"

# R1, #2684: the replica's native and WASM builds compared (node.mjs beside it), and its three numbers.
[[bin]]
name = "replica-equal"
path = "replica-equal/main.rs"

# K8, #2671: publishing a frozen copy each tick, with and without readers.
[[bin]]
name = "frozen"
path = "src/frozen.rs"

[[bin]]
name = "timers"
path = "src/timers.rs"

[[bin]]
name = "moves"
path = "src/moves.rs"

[[bin]]
name = "gateway-restart"
path = "gateway-restart/main.rs"

[[bin]]
name = "walkers"
path = "walkers/main.rs"

# F1, #2766: the form runner's steps in progress, by B2's measure.
[[bin]]
name = "forms"
path = "src/forms.rs"

[dependencies]
replica = { path = "../../crates/replica" }
# The `timers` bench runs the due list's scenario on a generated world (K9, #2672).
sim = { path = "../../crates/sim" }
testworld = { path = "../testworld" }
worldd = { path = "../../crates/worldd" }
gatewayd = { path = "../../crates/gatewayd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
import-eden = { path = "../import-eden" }
# The `moves` bench places its bodies with the script driver's helpers (B2, #2681).
body-script = { path = "../body-script" }
# The `forms` bench binds the runner's kinds into steps (F1, #2766).
skills = { path = "../../crates/skills" }
