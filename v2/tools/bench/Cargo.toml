[package]
name = "bench"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Engine v2 benches, run by hand and declared in their task's issue (Engine v2, #2635). `tree`: K2, #2646. `view-tier`: R3, #2697. `subscription`: R4, #2698. `replica-equal`: R1, #2684. `restart`: K5, #2669. `gateway-restart`: I1, #2683. `resync`: R5, #2699."

[[bin]]
name = "tree"
path = "src/tree.rs"

[[bin]]
name = "view-tier"
path = "view-tier/main.rs"

[[bin]]
name = "subscription"
path = "subscription/main.rs"

# R1, #2684: the replica's native and WASM builds compared (node.mjs beside it), and its three numbers.
[[bin]]
name = "replica-equal"
path = "replica-equal/main.rs"

[[bin]]
name = "restart"
path = "src/restart.rs"

[[bin]]
name = "gateway-restart"
path = "gateway-restart/main.rs"

[[bin]]
name = "resync"
path = "resync/main.rs"

[dependencies]
replica = { path = "../../crates/replica" }
sim = { path = "../../crates/sim" }
worldd = { path = "../../crates/worldd" }
gatewayd = { path = "../../crates/gatewayd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
