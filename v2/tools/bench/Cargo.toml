[package]
name = "bench"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Engine v2 benches, run by hand and declared in their task's issue (Engine v2, #2635). `tree`: K2, #2646; `gateway-restart`: I1, #2683; `frozen`: K8, #2671; `timers`: K9, #2672; `restart`: K5, #2669; `moves`: B2, #2681; `seats`: B3, #2682; `view-tier`: R3, #2697; `subscription`: R4, #2698."

[[bin]]
name = "seats"
path = "src/seats.rs"

[[bin]]
name = "tree"
path = "src/tree.rs"

[[bin]]
name = "gateway-restart"
path = "gateway-restart/main.rs"

# R1, #2684: the replica's native and WASM builds compared (node.mjs beside it), and its three numbers.
[[bin]]
name = "replica-equal"
path = "replica-equal/main.rs"

# K8, #2671: publishing a frozen copy each tick, with and without readers.
[[bin]]
name = "frozen"
path = "src/frozen.rs"

# I3, #2686: the clock's time per committed act, with checks on checker threads.
[[bin]]
name = "commit-cost"
path = "commit-cost/main.rs"

[[bin]]
name = "timers"
path = "src/timers.rs"

# I4, #2687: acts from arrival at the world process to answer, and the kill run.
[[bin]]
name = "act-latency"
path = "act-latency/main.rs"

[[bin]]
name = "restart"
path = "src/restart.rs"

[[bin]]
name = "moves"
path = "src/moves.rs"

[[bin]]
name = "view-tier"
path = "view-tier/main.rs"

[[bin]]
name = "subscription"
path = "subscription/main.rs"

# O4, #2694: the answer's parts summed against the client's wait, and the clock thread's stamping cost.
[[bin]]
name = "measures"
path = "measures/main.rs"

# N15, #2660 and #3167: the walker scene, a thousand walkers in Eden on the clock.
[[bin]]
name = "walkers"
path = "walkers/main.rs"

[dependencies]
replica = { path = "../../crates/replica" }
gatewayd = { path = "../../crates/gatewayd" }
sim = { path = "../../crates/sim" }
worldd = { path = "../../crates/worldd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# The `timers` bench runs the due list's scenario on a generated world (K9, #2672).
testworld = { path = "../testworld" }
import-eden = { path = "../import-eden" }
# The `moves` bench places its bodies with the script driver's helpers (B2, #2681).
body-script = { path = "../body-script" }
# N15, #2660: the walker scene drives bodies through the walk skill.
skills = { path = "../../crates/skills" }
