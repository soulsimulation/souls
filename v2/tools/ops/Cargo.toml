[package]
name = "ops"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Operations tools in Rust (Engine v2, #2635): deploy and roll back one world (O7, #2804); the gateway's upgrade (O16, #2809); moving a live world to another machine and its kill table (O9, #2828); a world restored from the bucket alone (O12, #2807)."

[[bin]]
name = "ops"
path = "src/main.rs"

# `deploy <world> <hash>` and `deploy rollback ...`: the commands on a machine with O1's units.
[[bin]]
name = "deploy"
path = "src/deploy.rs"

# The planted bad builds' world: dies at start, stalls, or refuses every act, only when served.
[[bin]]
name = "o7-plant"
path = "src/plant.rs"

# The O7 run: 100 agents through the gateway, three planted builds rolled back, a refused rollback, the rehearsal.
[[bin]]
name = "o7-run"
path = "src/run.rs"

# `gateway-upgrade <new gatewayd> <world>...`: the gateway's upgrade, never in the same step as a world's deploy (O16).
[[bin]]
name = "gateway-upgrade"
path = "src/gateway_upgrade.rs"

# The O16 run: the gateway upgraded, then killed, under 1,000 agents from the shared shapes.
[[bin]]
name = "o16-run"
path = "src/gateway_run.rs"

[dependencies]
replica = { path = "../../crates/replica" }
# K4's log and K5's checkpoints.
sim = { path = "../../crates/sim" }
# The directory's claim and mark (W8).
directoryd = { path = "../../crates/directoryd" }
# The shipper and the rebuild's fetch (O3).
worldd = { path = "../../crates/worldd" }
# The move's steps and fence, and the folder store with a cross-process lock (O9).
supervisor = { path = "../../crates/supervisor" }
# The gate that holds and releases intents (O9).
gatewayd = { path = "../../crates/gatewayd" }
# O20 (#2812): the world's stores outside its log, restored as one step of O12's restore.
backup = { path = "backup" }
# The benches' scripted world and the shared store (V3, O3).
archive = { path = "../archive" }
# O7's run drives 100 agents through the gateway's socket.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
