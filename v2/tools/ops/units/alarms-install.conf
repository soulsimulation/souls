# The install's drop-in for souls-alarms.service (Engine v2 O2, #2731): the daemon stays root, since it starts
# worldd@ units, but runs in the group souls with a umask that makes its socket ($WORLDS_ROOT/alarms.sock)
# group-writable, so a world going to sleep and its gateway asking a wake (both the user souls) can reach it.
[Service]
Group=souls
UMask=0007
