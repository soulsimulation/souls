# Installed as worldd@.service.d/10-install.conf by v2/tools/ops/install.sh (Engine v2 O17, #2810): on an installed
# machine a world runs as the unprivileged souls user, inside souls.slice, writes only under /var/lib/souls, and reads
# the root-owned secrets file (systemd reads it before it drops to the user). O1's runs on a scratch machine install
# the unit without this.
[Service]
User=souls
Group=souls
Slice=souls.slice
EnvironmentFile=-/etc/souls/secrets.env
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/var/lib/souls
