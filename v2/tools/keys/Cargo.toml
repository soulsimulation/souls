[package]
name = "keys"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Engine v2 B10 (#2688): a keyboard client that drives a body through the gateway with the same intents an agent sends."

[dependencies]
replica = { path = "../../crates/replica" }
sim = { path = "../../crates/sim" }
# The test world's Soul and chairs (`worldd gateway-link --testworld`), and a move's event names.
worldd = { path = "../../crates/worldd" }
# A development token: issued and hashed as the gateway does.
gatewayd = { path = "../../crates/gatewayd" }
# The gateway's WebSocket, blocking: one socket, polled between keys.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
