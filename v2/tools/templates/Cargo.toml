[package]
name = "templates"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Engine v2 G9 (#2798): a checkpoint published as a template, and the scan that finds no Soul, body or private state in a world."

[dependencies]
import-eden = { path = "../import-eden" }
replica = { path = "../../crates/replica" }
sim = { path = "../../crates/sim" }
skills = { path = "../../crates/skills" }
# A template's tree is built as worldd builds a world from facts: its courses step first (`worldd::courses`).
worldd = { path = "../../crates/worldd" }

[dev-dependencies]
directoryd = { path = "../../crates/directoryd" }
