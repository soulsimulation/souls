<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="The models, animations and sounds Souls uses, where they came from and their licences." />
    <link rel="canonical" href="https://soul.game/credits" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101110" media="(prefers-color-scheme: dark)" />
    <title>Credits · Souls</title>
    <!-- N-W7 (#3693): filled from the CDN's licence records (tools/cdn/approved-derivatives.json) at build time
         (src/credits/credits.ts). No script. Tokens and type follow the changelog page. -->
    <style>
      :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1b1b18; --dim: #77776f; --line: #d8d8cf; --accent: #0b6e4f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101110; --fg: #e4e4dc; --dim: #8b8b82; --line: #2b2c29; --accent: #6fd6a8; } }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      a { color: var(--accent); overflow-wrap: anywhere; }
      main { max-width: 900px; margin: 6vh auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
      nav a { color: var(--dim); text-decoration: none; }
      h1 { margin: 24px 0 8px; }
      h2 { margin: 32px 0 8px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 16px; }
      h3 { margin: 18px 0 4px; font-size: 13px; }
      ul { padding-left: 18px; margin: 4px 0; }
      li { overflow-wrap: anywhere; }
      .cr-dim, .cr-licence { color: var(--dim); }
      summary { cursor: pointer; color: var(--dim); margin: 4px 0; }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="/">← Souls</a> · <a href="/changelog">Changelog</a></nav>
      <h1>Credits</h1>
      <p>Where the models and animations in Souls come from, and their licences.</p>
<!--credits-->
    </main>
  </body>
</html>
