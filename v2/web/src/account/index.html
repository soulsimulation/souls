<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%233d6fb6%27/%3E%3C/svg%3E">
    <title>Souls v2 account</title>
    <style>
      html, body { margin: 0; background: #10141a; color: #e8e6e1; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; margin: 0 0 16px; }
      h2 { font-size: 17px; margin: 24px 0 8px; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2a313b; }
      li code { overflow-wrap: anywhere; font-size: 13px; }
      li button { margin-left: auto; }
      .muted { color: #9aa3ad; font-size: 13px; }
      form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
      label { display: grid; gap: 4px; font-size: 13px; color: #9aa3ad; }
      label.switch { display: flex; gap: 8px; align-items: center; color: #e8e6e1; font-size: 15px; padding: 6px 0; }
      input, button { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid #2a313b;
        background: #10141a; color: #e8e6e1; }
      button { background: #3d6fb6; border-color: #3d6fb6; cursor: pointer; }
      button:disabled { opacity: 0.6; }
      .mine img, .mine .pic { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; }
      .mine .pic { display: grid; place-items: center; background: #2a313b; }
      .mine .buttons { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
      .mine .buttons button { margin: 0; } .danger { background: #a33; border-color: #a33; }
      #settings { margin-top: 12px; padding: 16px; background: #182029; border-radius: 6px; }
      [hidden] { display: none !important; }
      /* Phones and touch screens (W14): every control at least 44 px, as today's pages (apps/web world-chrome.css). */
      @media (max-width: 700px), (pointer: coarse) {
        input:not([type=checkbox]), button { min-height: 44px; min-width: 44px; box-sizing: border-box; }
        label.switch { min-height: 44px; padding: 0; }
        input[type=checkbox] { width: 20px; height: 20px; }
      }
      @media (max-width: 700px) {
        li.mine { display: grid; grid-template-columns: 48px 1fr; }
        .mine .buttons { grid-column: 1 / -1; margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your account</h1>
      <button id="signin" type="button">Sign in</button>
      <form id="who" hidden>
        <label>Signed in as (test sign-in)<input id="person" autocomplete="off" required maxlength="64"></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="signed" hidden>
        <h2>Your Souls</h2>
        <ul id="souls"><li class="muted">reading your Souls</li></ul>
        <h2>Connected agents</h2>
        <p>Disconnecting an account login prevents future adoptions. Soul credentials and memories stay where they are.</p>
        <ul id="agents"></ul>
        <h2>A world's settings</h2>
        <form id="pick">
          <label>Your world's name<input id="world" autocomplete="off" required maxlength="40"></label>
          <button type="submit">Open its settings</button>
        </form>
        <section id="settings" hidden>
          <div><strong id="world-name"></strong> <span id="world-state" class="muted"></span></div>
          <label class="switch"><input type="checkbox" id="open"> Open to visitors (visiting Souls may enter)</label>
          <label class="switch"><input type="checkbox" id="listed"> On the list of worlds</label>
        </section>
      </div>
      <p id="said" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./account.ts"></script>
  </body>
</html>
