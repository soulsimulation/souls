<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Souls</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 8vh auto; padding: 0 16px; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      ul { padding: 0; list-style: none; }
      li { padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
      .muted { opacity: 0.65; font-size: 13px; }
      /* Phones and touch screens (W14): every control at least 44 px, as today's pages (apps/web world-chrome.css). */
      @media (max-width: 700px), (pointer: coarse) {
        li { padding: 0; }
        a[href] { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; overflow-wrap: anywhere; }
      }
    </style>
  </head>
  <body>
    <header><h1>Souls</h1><a id="sign-in" hidden>Sign in</a></header>
    <ul id="list"><li class="muted">reading the list…</li></ul>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
