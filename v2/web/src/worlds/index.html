<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Souls v2 worlds</title>
    <style>
      html, body { margin: 0; background: #10141a; color: #e8e6e1; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; margin: 0 0 16px; }
      ul { list-style: none; padding: 0; margin: 0 0 24px; }
      li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #2a313b; }
      li a { color: #e8e6e1; font-weight: 600; }
      .muted { color: #9aa3ad; font-size: 13px; }
      form { display: grid; gap: 10px; padding: 16px; background: #182029; border-radius: 6px; }
      label { display: grid; gap: 4px; font-size: 13px; color: #9aa3ad; }
      input, select, button { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid #2a313b;
        background: #10141a; color: #e8e6e1; }
      button { background: #3d6fb6; border-color: #3d6fb6; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: progress; }
      #progress { min-height: 1.5em; }
      .refused { color: #f0a46b; }
      /* Phones and touch screens (W14): every control at least 44 px, as today's pages (apps/web world-chrome.css). */
      @media (max-width: 700px), (pointer: coarse) {
        input, select, button { min-height: 44px; box-sizing: border-box; }
        li { align-items: center; padding: 0; }
        li a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; overflow-wrap: anywhere; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Worlds</h1>
      <section id="handoff-accept" hidden aria-label="Accept a world">
        <h2>Accept this world</h2>
        <form><label>Signed in as (test sign-in)<input autocomplete="off" maxlength="64"></label><button type="submit">Accept this world</button></form>
        <p role="status" aria-live="polite"></p>
      </section>
      <ul id="list"><li class="muted">reading the list</li></ul>
      <form id="create">
        <label>Signed in as (test sign-in)<input id="who" autocomplete="off" required maxlength="64"></label>
        <label>Your label, shown as the world's creator<input id="label" required maxlength="40"></label>
        <label>The world's name (a-z, 0-9 and -)<input id="name" required maxlength="40" pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?"></label>
        <label>Made from<select id="template"></select></label>
        <button id="go" type="submit">Create</button>
        <div id="progress" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script type="module" src="./worlds.ts"></script>
  </body>
</html>
