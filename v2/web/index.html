<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Souls v2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141a; color: #e8e6e1; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(16, 20, 26, 0.78);
        font: 13px/1.45 ui-monospace, Menlo, monospace; border-radius: 4px; pointer-events: none; white-space: pre; }
      #status b { font-weight: 600; }
      /* Phones and touch screens (W14), as today's pages (apps/web world-chrome.css): every control at least 44 px; the
         sound bar wraps across the top with a Soul's page under it; the New Soul card sits above the find box and its
         button. The controls are styled inline by their modules, so these rules carry !important. */
      @media (max-width: 700px), (pointer: coarse) {
        button, select, input { min-height: 44px !important; min-width: 44px !important; box-sizing: border-box !important; }
        #soul-page > button { width: 44px; height: 44px; margin: -10px -10px 0 0; }
      }
      @media (max-width: 700px) {
        #sound-bar { left: 8px; flex-wrap: wrap; justify-content: flex-end; }
        #sound-bar > button, #sound-bar > select { white-space: nowrap; }
        #status { top: 108px; max-width: calc(100vw - 24px); overflow: hidden; font-size: 11px; }
        #soul-page { top: 108px !important; left: 8px !important; right: 8px !important; width: auto !important;
          max-height: calc(50vh - 120px) !important; background: rgba(16, 20, 26, 0.97) !important; }
        #new-soul-card { bottom: 68px !important; }
        #creator-panel { top: 108px !important; }
      }
      /* #3780: the boot card, today's arrival card (apps/web index.html, #1166) painted with the page's first frame so the
         page never shows a plain "starting" while its scripts load; the arrival card (src/arrival/card.ts) covers it and
         it goes the moment that card is up, or 600 ms after the page has said something else. */
      #boot-arrival { position: fixed; inset: 0; z-index: 2147480000; display: grid; place-items: center; padding: 16px;
        overflow: hidden; pointer-events: none; background: #000; color: #000; font: 15px/1.5 system-ui, sans-serif; }
      #boot-arrival .arrival-disc { position: absolute; left: 50%; top: 50%; width: calc(146px * 2 / .31); aspect-ratio: 1;
        transform: translate(-50%, -50%) scale(.33); border-radius: 50%; background: radial-gradient(circle closest-side,
        #fff 31%, rgba(255,246,236,.64) 41%, rgba(255,242,230,.42) 51%, rgba(255,238,222,.27) 60%, rgba(255,238,222,.08) 78%, transparent); }
      #boot-arrival .arrival-text { position: relative; display: grid; gap: 10px; width: min(240px, 70vw); text-align: center; }
      #boot-arrival .arrival-title { margin: 0; font-weight: 650; font-size: 17px; letter-spacing: -.005em; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      #boot-arrival progress { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border: 0; border-radius: 2px;
        overflow: hidden; background: rgba(0,0,0,.16); }
      #boot-arrival progress::-webkit-progress-bar { background: transparent; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">starting</div>
    <script>(function(){try{var l=location,q=new URLSearchParams(l.search),h=new URLSearchParams(l.hash.replace(/^#/,''));if(q.has('shot')||(h.get('w')&&h.get('l')&&h.has('t')))return;var m=/^\/(preview\/)?w\/([a-z0-9][a-z0-9-]{0,62})(?:\/|$)/.exec(l.pathname),d=document,b=d.createElement('div');b.id='boot-arrival';b.setAttribute('role','status');b.setAttribute('aria-live','polite');b.innerHTML='<div class="arrival-disc" aria-hidden="true"></div><div class="arrival-text"><p class="arrival-title"></p><progress max="1000" value="0" aria-label="World loading progress"></progress></div>';b.querySelector('.arrival-title').textContent=q.get('world')||(m&&m[2])||'Souls';d.body.appendChild(b);var s=d.getElementById('status'),t0=0,iv=setInterval(function(){var now=Date.now();if(d.getElementById('arrival')||(s&&s.textContent!=='starting'&&now-(t0=t0||now)>600)){clearInterval(iv);b.remove();}},50);}catch(e){}})()</script>
    <script type="module" src="./src/draw/main.ts"></script>
  </body>
</html>
