# The checkers board's rules, a code hatch's module (#3713): built to content/kinds/games/checkers_board.wasm by
# ./build.sh. Its own workspace, so the v2 workspace never builds it.
[package]
name = "checkers-move"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "checkers.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
