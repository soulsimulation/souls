[package]
name = "worldd"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The world process (Engine v2, #2635): its clock and watchdog (K7, #2647); checkers (I3, #2686)."

[dependencies]
replica = { path = "../replica" }
rustix = { version = "1", default-features = false, features = ["time", "std"] }
sim = { path = "../sim" }

[dev-dependencies]
# E1's Eden measures (tests/index.rs) load Eden 2026's imported tree (N1, #2649).
import-eden = { path = "../../tools/import-eden" }
