[package]
name = "worldd"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The world process (Engine v2, #2635): its clock and watchdog (K7, #2647). Checkers: I3, #2686. Moves from the gateway: I4b, #3156."

[dependencies]
replica = { path = "../replica" }
rustix = { version = "1", default-features = false, features = ["time", "std"] }
# D6: a SIGTERM or SIGINT says so before the world ends (src/stopped.rs).
libc = "0.2"
sim = { path = "../sim" }
# O3 (#2732): the object store and the directory's claim and mark, which the shipper writes through.
directoryd = { path = "../directoryd" }
# O3b (#3458): `serve` archives its history (V3's archiver) into the store it ships to, O9's folder store.
archive = { path = "../../tools/archive" }
supervisor = { path = "../supervisor" }
# The built-in walk, run behind the host for a move intent (I4b, #3156).
skills = { path = "../skills" }
# E1's Eden measures (tests/index.rs) load Eden 2026's imported tree (N1, #2649); N2's test world, where a scripted
# client walks, sits and rises (I4b, #3156), and where `gateway-link --testworld` serves a Soul and three chairs (B10,
# #2688); `worldd serve` reads a world's facts file with N1's loader (C1, #3365).
import-eden = { path = "../../tools/import-eden" }
testworld = { path = "../../tools/testworld" }

[features]
# A test's long load, `$WORLDD_HOLD_LOAD_S` seconds of progress before `serve` loads (#4013, x5-start-progress.sh).
hold-load = []

[dev-dependencies]
# O20b (#3523): a served world's shipped stores read back by O20's restore, as O12's restore runs it.
backup = { path = "../../tools/ops/backup" }
# G1e (#3532): a served world's creator edits it through a real gateway (tests/edit_served.rs).
gatewayd = { path = "../gatewayd" }
# A world made from a published template, rehearsed and served again as a release's deploy moves it (tests/serve.rs).
templates = { path = "../../tools/templates" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
