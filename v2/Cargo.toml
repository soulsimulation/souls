# Engine v2 (#2635): the Rust workspace (K1, #2638). Every folder under crates/ and tools/ with a Cargo.toml is a
# member, so a crate added later edits no shared file. CI's `v2` job runs v2/tools/ci.sh on it.
[workspace]
members = ["crates/*", "tools/*"]
# Node packages, not crates (T0, #2639; K14, #2648).
exclude = ["tools/encoding-vectors", "tools/arch"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# The `wasm-bindgen` command v2/tools/ci.sh installs takes its version from Cargo.lock, so the two always match.
wasm-bindgen = "=0.2.130"
# The walkable ground (N3, #2651): union and difference on an integer grid, and the cut into triangles.
i_overlay = "=9.2.0"
i_triangle = "=0.51.0"

# Native builds unwind on a panic (K11 catches them per controller). WASM aborts on a panic whatever this says, so
# `replica` never relies on catching one.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
