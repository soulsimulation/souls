# Engine v2 (#2635): the Rust workspace (K1, #2638). Every folder under crates/ is a member (each needs a Cargo.toml),
# so a crate added there edits no shared file. Folders under tools/ hold Node scripts, checks and data too, so only
# the Rust tool crates are listed here: one per line, sorted, so two PRs that add different crates merge without
# conflict. CI's `v2` job runs v2/tools/ci.sh on the workspace.
[workspace]
members = [
    "crates/*",
    "tools/archive",
    "tools/bench",
    "tools/birdseye",
    "tools/body-script",
    "tools/compare-reach",
    "tools/driver",
    "tools/facts",
    "tools/form-stop",
    "tools/gates/team",
    "tools/import-eden",
    "tools/import-world",
    "tools/keys",
    "tools/log-crash",
    "tools/ops",
    "tools/ops/backup",
    "tools/replay-compare",
    "tools/scan-ids",
    "tools/stall-test",
    "tools/stream-check",
    "tools/templates",
    "tools/testworld",
    "tools/wasm-load",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# The `wasm-bindgen` command v2/tools/ci.sh installs takes its version from Cargo.lock, so the two always match.
wasm-bindgen = "=0.2.130"
# The walkable ground (N3, #2651): union and difference on an integer grid, and the cut into triangles.
i_overlay = "=9.2.0"
i_triangle = "=0.51.0"

# Native builds unwind on a panic (K11 catches them per controller). WASM aborts on a panic whatever this says, so
# `replica` never relies on catching one.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
# Integer overflow panics in release builds too (the WASM build included), as it does in the tests.
overflow-checks = true
